name: Control V4 Runtime Carrier
run-name: Control V4 runtime command ${{ github.event.comment.id || github.run_id }}

on:
  schedule:
    - cron: '30 * * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: "Control start mode"
        required: true
        default: control-go
        type: choice
        options:
          - control-go
          - review-resume

permissions:
  contents: read
  issues: write

jobs:
  runtime-carrier:
    if: >-
      ${{
        github.repository == 'market-predictions/control-engine' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'market-predictions' &&
        github.triggering_actor == 'market-predictions' &&
        github.event.action == 'created' &&
        github.event.issue.number == 106 &&
        github.event.issue.pull_request == null &&
        (
          startsWith(github.event.comment.body, 'CONTROL_V4_RUNTIME_TICK') ||
          startsWith(github.event.comment.body, 'CONTROL_V4_RUNTIME_EVENT')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted Control Engine main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Reject stale or misbound command before private capability
        id: admission
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_V4_PUBLIC_COMMAND: ${{ github.event.comment.body }}
          CONTROL_V4_PUBLIC_COMMAND_CREATED_AT: ${{ github.event.comment.created_at }}
          CONTROL_V4_TICK_MAX_AGE_SECONDS: '120'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import os
          import re

          from control_engine.v4_runtime_protocol import INTERACTIVE_RUN_ID_RE, RuntimeProtocolError, parse_public_command

          EXPECTED_RUN_ID = re.compile(
              r"^v4:6a9a7e0b18b08191876c134d83cfbba2:b6f42d03a917ce58:[0-9a-f]{32}$"
          )
          MANUAL_RUN_ID = re.compile(
              r"^v41:gh:[1-9][0-9]{5,19}$"
          )

          raw_command = os.environ.get("CONTROL_V4_PUBLIC_COMMAND", "")
          try:
              created_at = datetime.fromisoformat(
                  os.environ["CONTROL_V4_PUBLIC_COMMAND_CREATED_AT"].replace("Z", "+00:00")
              )
              command = parse_public_command(raw_command)
          except (KeyError, TypeError, ValueError, RuntimeProtocolError) as exc:
              raise SystemExit("command admission identity invalid") from exc
          if created_at.tzinfo is None:
              raise SystemExit("command admission timestamp must be timezone-aware")

          admitted = (EXPECTED_RUN_ID.fullmatch(command["run_id"]) is not None
                      or INTERACTIVE_RUN_ID_RE.fullmatch(command["run_id"]) is not None
                      or MANUAL_RUN_ID.fullmatch(command["run_id"]) is not None)
          reason = "PASS" if admitted else "RUNNER_GENERATION_MISMATCH"

          if admitted and command["kind"] == "TICK":
              try:
                  max_age = int(os.environ["CONTROL_V4_TICK_MAX_AGE_SECONDS"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit("TICK max age invalid") from exc
              age_seconds = (datetime.now(timezone.utc) - created_at.astimezone(timezone.utc)).total_seconds()
              if not 0 <= age_seconds <= max_age:
                  admitted = False
                  reason = "STALE"

          print(f"CONTROL_V4_COMMAND_ADMISSION={reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"admitted={'true' if admitted else 'false'}\n")
          PY

      - name: Create exact private runtime capability
        if: ${{ steps.admission.outputs.admitted == 'true' }}
        id: private-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: market-predictions
          repositories: control-plane
          permission-contents: write

      - name: Execute bounded typed V4 runtime carrier
        if: ${{ steps.admission.outputs.admitted == 'true' }}
        id: carrier
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_PLANE_TOKEN: ${{ steps.private-token.outputs.token }}
          CONTROL_ENGINE_TOKEN: ${{ github.token }}
          CONTROL_V4_PUBLIC_COMMAND: ${{ github.event.comment.body }}
          CONTROL_V4_PUBLIC_COMMAND_ID: ${{ github.event.comment.id }}
          CONTROL_V4_PUBLIC_COMMAND_CREATED_AT: ${{ github.event.comment.created_at }}
        run: python scripts/control_v4_runtime_carrier.py

      - name: Diagnose anonymous REST budget after safe carrier error
        if: ${{ steps.admission.outputs.admitted == 'true' && steps.carrier.outputs.ok != 'true' }}
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/rate_limit",
              headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "control-v4-anonymous-rate-diagnostic",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  payload = json.load(response)
              core = ((payload.get("resources") or {}).get("core") or {})
              limit = core.get("limit")
              remaining = core.get("remaining")
              reset = core.get("reset")
              if all(isinstance(value, int) for value in (limit, remaining, reset)):
                  print(
                      "CONTROL_V4_ANON_RATE_LIMIT="
                      f"limit:{limit},remaining:{remaining},reset:{reset}"
                  )
              else:
                  print("CONTROL_V4_ANON_RATE_LIMIT=UNAVAILABLE")
          except urllib.error.HTTPError as exc:
              remaining = exc.headers.get("x-ratelimit-remaining", "unknown")
              reset = exc.headers.get("x-ratelimit-reset", "unknown")
              print(
                  "CONTROL_V4_ANON_RATE_LIMIT="
                  f"HTTP_{exc.code},remaining:{remaining},reset:{reset}"
              )
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
              print("CONTROL_V4_ANON_RATE_LIMIT=UNAVAILABLE")
          PY

      - name: Auto-materialize governed exact candidate after NO_WORK
        if: ${{ steps.carrier.outputs.ok == 'true' && contains(steps.carrier.outputs.result_json, '"result":"NO_WORK"') }}
        id: replenishment
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_PLANE_TOKEN: ${{ steps.private-token.outputs.token }}
          CONTROL_ENGINE_TOKEN: ${{ github.token }}
          CONTROL_V4_PUBLIC_COMMAND: ${{ github.event.comment.body }}
          CONTROL_V4_PUBLIC_COMMAND_ID: ${{ github.event.comment.id }}
          CONTROL_V4_PUBLIC_COMMAND_CREATED_AT: ${{ github.event.comment.created_at }}
          CONTROL_V4_CARRIER_RESULT: ${{ steps.carrier.outputs.result_json }}
        run: python scripts/control_v4_auto_replenish.py

      - name: Publish public-safe carrier result
        if: ${{ always() && (steps.replenishment.outputs.result_json != '' || steps.carrier.outputs.result_json != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_JSON: ${{ steps.replenishment.outputs.result_json != '' && steps.replenishment.outputs.result_json || steps.carrier.outputs.result_json }}
          COMMAND_COMMENT_ID: ${{ github.event.comment.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.loads(os.environ["RESULT_JSON"])
          if not isinstance(payload, dict) or "command_comment_id" in payload:
              raise SystemExit("carrier result envelope invalid")
          payload["command_comment_id"] = int(os.environ["COMMAND_COMMENT_ID"])
          result_json = json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
          body = f"CONTROL_V4_RUNTIME_RESULT {result_json}"
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/106/comments",
              data=json.dumps({"body": body}, separators=(",", ":")).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "control-v4-runtime-carrier-result",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if not isinstance(result.get("id"), int):
              raise SystemExit("public result comment readback missing")
          print("CONTROL_V4_RUNTIME_PUBLIC_RESULT=POSTED")
          PY

      - name: Fail workflow after safe error publication
        if: ${{ steps.carrier.outputs.ok != 'true' }}
        run: exit 1

  review-resume:
    # Deterministic reconciliation only; never starts a semantic AI worker.
    if: >-
      ${{
        github.repository == 'market-predictions/control-engine' &&
        github.ref == 'refs/heads/main' &&
        github.run_attempt == 1 &&
        (
          github.event_name == 'schedule' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.mode == 'review-resume' &&
            github.actor == 'market-predictions' &&
            github.triggering_actor == 'market-predictions'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: control-v4-review-resume
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout trusted Control Engine main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing carrier dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Create existing bounded private runtime capability
        id: private-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: market-predictions
          repositories: control-plane
          permission-contents: write
      - name: Reconcile one pending exact-candidate review
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_PLANE_TOKEN: ${{ steps.private-token.outputs.token }}
          CONTROL_ENGINE_TOKEN: ${{ github.token }}
        run: python scripts/control_v4_review_resume.py

  interactive-control-start:
    # Native owner dispatch, direct existing V4 CAS carrier, no Work dependency.
    if: >-
      ${{
        github.repository == 'market-predictions/control-engine' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.mode == 'control-go' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'market-predictions' &&
        github.triggering_actor == 'market-predictions' &&
        github.run_attempt == 1
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Core engineering is independent of the optional Agent/Hermes project.
    env:
      CONTROL_V4_CORE_FLOW: 'true'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted Control Engine main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing carrier dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Create existing bounded private runtime capability
        id: private-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: market-predictions
          repositories: control-plane
          permission-contents: write
      - name: Bind one native run to one fresh Control task acquisition
        env:
          OWNER_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          run = int(os.environ["OWNER_RUN_ID"])
          if run <= 0:
              raise SystemExit("invalid owner run identity")
          command = "CONTROL_V4_RUNTIME_TICK " + json.dumps(
              {"run_id": f"v41:control-go:{run}"}, separators=(",", ":"))
          created = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CONTROL_V4_PUBLIC_COMMAND={command}\n")
              env.write(f"CONTROL_V4_PUBLIC_COMMAND_ID={run}\n")
              env.write(f"CONTROL_V4_PUBLIC_COMMAND_CREATED_AT={created}\n")
          PY
      - name: Queue one existing authorized Mission gap
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_PLANE_TOKEN: ${{ steps.private-token.outputs.token }}
          CONTROL_ENGINE_TOKEN: ${{ github.token }}
        run: python scripts/control_v4_queue_open_gap.py
      - name: Refresh TICK freshness after bounded queue append
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import os
          fresh = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CONTROL_V4_PUBLIC_COMMAND_CREATED_AT={fresh}\n")
          PY
      - name: Acquire via existing authority, lease and atomic CAS checks
        id: carrier
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_PLANE_TOKEN: ${{ steps.private-token.outputs.token }}
          CONTROL_ENGINE_TOKEN: ${{ github.token }}
        run: python scripts/control_v4_runtime_carrier.py
      - name: Publish bounded handover to ChatGPT Control
        id: handover
        if: ${{ steps.carrier.outputs.ok == 'true' && steps.carrier.outputs.result_json != '' }}
        env:
          RESULT_JSON: ${{ steps.carrier.outputs.result_json }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          result = json.loads(os.environ["RESULT_JSON"])
          if result.get("run_id") != f"v41:control-go:{os.environ['OWNER_RUN_ID']}":
              raise SystemExit("handover run identity mismatch")
          if result.get("result") not in {"WORK", "BUSY", "NO_WORK", "UNSUPPORTED"}:
              raise SystemExit("unsupported handover result")
          # This is a transport receipt, not a trusted semantic review verdict.
          body = "CONTROL_INTERACTIVE_HANDOVER_V1\n" + json.dumps(
              result, sort_keys=True, separators=(",", ":"))
          from datetime import datetime, timedelta, timezone
          import urllib.error
          import time

          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/106/comments"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          since = (datetime.now(timezone.utc) - timedelta(minutes=2)).isoformat().replace("+00:00", "Z")

          def verify_existing():
              from urllib.parse import urlencode
              query = urlencode({"since": since, "per_page": 100})
              req = urllib.request.Request(url + "?" + query, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as response:
                  comments = json.load(response)
              if not isinstance(comments, list) or len(comments) >= 100:
                  raise RuntimeError("handover reconciliation not bounded")
              matches = [item for item in comments if (
                  item.get("body") == body
                  and item.get("user", {}).get("login") == "github-actions[bot]"
                  and (item.get("performed_via_github_app") or {}).get("slug") == "github-actions"
                  and type(item.get("id")) is int
              )]
              if len(matches) > 1:
                  raise RuntimeError("duplicate handover receipts")
              return matches[0]["id"] if matches else None

          try:
              req = urllib.request.Request(
                  url, data=json.dumps({"body": body}).encode("utf-8"),
                  headers=headers, method="POST")
              with urllib.request.urlopen(req, timeout=25) as response:
                  posted = json.load(response)
              if posted.get("body") != body or type(posted.get("id")) is not int:
                  raise RuntimeError("handover POST acknowledgement invalid")
              receipt_id = posted["id"]
          except (urllib.error.URLError, TimeoutError, ValueError, RuntimeError):
              # Ambiguous POST: resolve exact immutable receipt before releasing holder.
              # If readback is unavailable, let the existing lease expire safely.
              try:
                  receipt_id = verify_existing()
              except (urllib.error.URLError, TimeoutError, ValueError, RuntimeError):
                  raise SystemExit("handover uncertain; preserve holder until lease expiry")
              if receipt_id is None:
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("safe_to_yield=true\n")
                  raise SystemExit("handover absent after bounded readback")
          print("CONTROL_INTERACTIVE_HANDOVER_COMMENT_ID=" + str(receipt_id))
          PY
      - name: Release holder if handover publication failed
        if: ${{ always() && steps.carrier.outputs.ok == 'true' && contains(steps.carrier.outputs.result_json, '"result":"WORK"') && steps.carrier.outputs.result_json != '' && steps.carrier.outcome == 'success' && steps.handover.outcome != 'success' && steps.handover.outputs.safe_to_yield == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_PLANE_TOKEN: ${{ steps.private-token.outputs.token }}
          CONTROL_ENGINE_TOKEN: ${{ github.token }}
          WORK_JSON: ${{ steps.carrier.outputs.result_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from scripts.control_v4_runtime_carrier import main
          capsule = json.loads(os.environ["WORK_JSON"])
          command = {key: capsule[key] for key in (
              "run_id", "task_token", "repository", "action")}
          if "candidate" in capsule:
              command["candidate"] = capsule["candidate"]
          command["event"] = "YIELD"
          os.environ["CONTROL_V4_PUBLIC_COMMAND"] = (
              "CONTROL_V4_RUNTIME_EVENT " + json.dumps(command, separators=(",", ":")))
          import tempfile
          with tempfile.NamedTemporaryFile(mode="r+", encoding="utf-8") as result_file:
              os.environ["GITHUB_OUTPUT"] = result_file.name
              if main() != 0:
                  raise SystemExit("holder release carrier failed")
              result_file.seek(0)
              lines = dict(line.strip().split("=", 1) for line in result_file if "=" in line)
          if lines.get("ok") != "true":
              raise SystemExit("holder release not confirmed")
          result = json.loads(lines.get("result_json", "{}"))
          if result.get("result") != "YIELDED" or result.get("run_id") != capsule["run_id"]:
              raise SystemExit("holder release returned no matching YIELDED result")
          PY
      - name: Fail closed on carrier rejection or handover publication failure
        if: ${{ steps.carrier.outputs.ok != 'true' }}
        run: exit 1
