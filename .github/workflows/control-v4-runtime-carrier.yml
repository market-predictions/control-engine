name: Control V4 Runtime Carrier

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  runtime-carrier:
    if: >-
      ${{
        github.repository == 'market-predictions/control-engine' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'market-predictions' &&
        github.triggering_actor == 'market-predictions' &&
        github.event.action == 'created' &&
        github.event.issue.number == 106 &&
        github.event.issue.pull_request == null &&
        (
          startsWith(github.event.comment.body, 'CONTROL_V4_RUNTIME_TICK {') ||
          startsWith(github.event.comment.body, 'CONTROL_V4_RUNTIME_EVENT {')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted Control Engine main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Create exact private runtime capability
        id: private-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: market-predictions
          repositories: control-plane
          permission-contents: write

      - name: Normalize observed V4 Runner compatibility envelope
        env:
          CONTROL_V4_PUBLIC_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re

          prefix = "CONTROL_V4_RUNTIME_EVENT "
          command = os.environ.get("CONTROL_V4_PUBLIC_COMMAND", "")
          normalized = command

          class DuplicateKeyError(ValueError):
              pass

          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise DuplicateKeyError(key)
                  value[key] = item
              return value

          if command.startswith(prefix):
              try:
                  payload = json.loads(command[len(prefix):], object_pairs_hook=unique_object)
              except (json.JSONDecodeError, DuplicateKeyError, TypeError, ValueError):
                  payload = None
              nested_keys = {"run_id", "task_token", "event", "repository", "candidate"}
              candidate_keys = {
                  "candidate_sha",
                  "candidate_pr_number",
                  "candidate_head_branch",
                  "expected_base_branch",
                  "expected_base_sha",
              }
              if isinstance(payload, dict) and payload.get("event") == "REVIEW_UNAVAILABLE" and set(payload) == nested_keys:
                  candidate = payload.get("candidate")
                  repository = payload.get("repository")
                  if isinstance(candidate, dict) and set(candidate) == candidate_keys and isinstance(repository, str):
                      candidate_sha = candidate.get("candidate_sha")
                      expected_base_sha = candidate.get("expected_base_sha")
                      expected_base_branch = candidate.get("expected_base_branch")
                      candidate_head_branch = candidate.get("candidate_head_branch")
                      candidate_pr_number = candidate.get("candidate_pr_number")
                      repo_ok = re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository) is not None
                      sha_ok = (
                          isinstance(candidate_sha, str)
                          and re.fullmatch(r"[0-9a-f]{40}", candidate_sha) is not None
                          and isinstance(expected_base_sha, str)
                          and re.fullmatch(r"[0-9a-f]{40}", expected_base_sha) is not None
                      )
                      branch_ok = (
                          isinstance(expected_base_branch, str)
                          and re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", expected_base_branch) is not None
                          and ".." not in expected_base_branch
                          and isinstance(candidate_head_branch, str)
                          and re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", candidate_head_branch) is not None
                          and ".." not in candidate_head_branch
                      )
                      pr_ok = isinstance(candidate_pr_number, int) and not isinstance(candidate_pr_number, bool) and candidate_pr_number > 0
                      if repo_ok and sha_ok and branch_ok and pr_ok:
                          flat = {
                              "run_id": payload.get("run_id"),
                              "task_token": payload.get("task_token"),
                              "event": "REVIEW_UNAVAILABLE",
                              "holder_candidate_sha": candidate_sha,
                              "holder_expected_base_branch": expected_base_branch,
                              "holder_expected_base_sha": expected_base_sha,
                          }
                          normalized = prefix + json.dumps(flat, separators=(",", ":"), sort_keys=True)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("CONTROL_V4_PUBLIC_COMMAND<<__CONTROL_V4_COMMAND__\n")
              output.write(normalized + "\n")
              output.write("__CONTROL_V4_COMMAND__\n")
          PY

      - name: Execute bounded typed V4 runtime carrier
        id: carrier
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_PLANE_TOKEN: ${{ steps.private-token.outputs.token }}
        run: python scripts/control_v4_runtime_carrier.py

      - name: Publish public-safe carrier result
        if: ${{ always() && steps.carrier.outputs.result_json != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_JSON: ${{ steps.carrier.outputs.result_json }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = f"CONTROL_V4_RUNTIME_RESULT {os.environ['RESULT_JSON']}"
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/106/comments",
              data=json.dumps({"body": body}, separators=(",", ":")).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "control-v4-runtime-carrier-result",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if not isinstance(result.get("id"), int):
              raise SystemExit("public result comment readback missing")
          print("CONTROL_V4_RUNTIME_PUBLIC_RESULT=POSTED")
          PY

      - name: Fail workflow after safe error publication
        if: ${{ steps.carrier.outputs.ok != 'true' }}
        run: exit 1
