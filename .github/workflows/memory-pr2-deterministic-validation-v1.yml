name: Memory PR2 Deterministic Validation V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/memory-pr2-deterministic-validation-v1.yml'

permissions:
  contents: read
  statuses: write

jobs:
  validate-memory-pr2:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public execution plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight GitHub App identity and installation
        id: app-preflight
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived read token for private Memory
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'read'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate exact frozen Memory candidate read-only
        id: validate
        continue-on-error: true
        shell: bash
        env:
          CONTROL_GITHUB_READ_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          MEMORY_REPOSITORY='market-predictions/memory'
          MEMORY_BRANCH='import/historical-context-phase-1'
          EXPECTED_HEAD='3e696d80e9b3820057d1144ee7f048fd81e6b171'
          EXPECTED_BASE='c407a9c8dfc5617f1a0adc6997a40ddd602ac011'
          ROOT="${RUNNER_TEMP}/memory-pr2-validation"
          REPO_DIR="${ROOT}/memory"
          mkdir -p "$REPO_DIR"
          trap 'rm -rf "$ROOT"' EXIT

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CONTROL_GITHUB_READ_TOKEN" | base64 -w0)"
          git -C "$REPO_DIR" init -q
          git -C "$REPO_DIR" remote add origin "https://github.com/${MEMORY_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" -C "$REPO_DIR" fetch --quiet --depth=2 origin \
            "refs/heads/${MEMORY_BRANCH}" "refs/heads/main"
          git -C "$REPO_DIR" checkout --detach --quiet "$EXPECTED_HEAD"

          actual_head="$(git -C "$REPO_DIR" rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"

          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" -C "$REPO_DIR" fetch --quiet --depth=1 origin \
            "refs/heads/main:refs/memory-validation/main"
          actual_base="$(git -C "$REPO_DIR" rev-parse refs/memory-validation/main)"
          test "$actual_base" = "$EXPECTED_BASE"

          set +e
          validator_output="$(cd "$REPO_DIR" && python scripts/validate_memory.py 2>&1)"
          validator_rc=$?
          set -e

          printf '%s\n' "$validator_output"
          printf 'validator_rc=%s\n' "$validator_rc" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$actual_head" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$actual_base" >> "$GITHUB_OUTPUT"
          if [ "$validator_rc" = '0' ]; then
            printf 'validation=PASS\n' >> "$GITHUB_OUTPUT"
          else
            printf 'validation=FAIL\n' >> "$GITHUB_OUTPUT"
          fi
          exit "$validator_rc"

      - name: Publish exact-head deterministic validation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION: ${{ steps.validate.outputs.validation }}
          HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
          BASE_SHA: ${{ steps.validate.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [ "$VALIDATION" = 'PASS' ] && \
             [ "$HEAD_SHA" = '3e696d80e9b3820057d1144ee7f048fd81e6b171' ] && \
             [ "$BASE_SHA" = 'c407a9c8dfc5617f1a0adc6997a40ddd602ac011' ]; then
            state=success
            context='memory/pr2-validator/3e696d80/PASS'
            description='MEMORY_PR2_EXACT_HEAD_VALIDATION_PASS'
          else
            state=failure
            context='memory/pr2-validator/3e696d80/FAIL'
            description='MEMORY_PR2_EXACT_HEAD_VALIDATION_FAIL'
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="$context" \
            -f description="$description" >/dev/null
          test "$state" = success
