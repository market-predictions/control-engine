name: Control B1 Missing CI Test Sync V1

on:
  push:
    branches:
      - control/199-g8-h13-b1-lifecycle-actuator-v1
    paths:
      - .github/workflows/control-b1-missing-ci-test-sync-v1.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Preflight GitHub App
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh
      - name: Create contents-write token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: control-engine
          permission-contents: write
      - name: Update exact regression expectation only
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CONTROL_TOKEN"
          repo="$RUNNER_TEMP/public"
          parent='8aa33a1255395c6bf2899e00521615b27b5f0872'
          file='tests/test_canonical_b1_dual_executor_v1.py'
          git clone --quiet --single-branch --branch main "https://x-access-token:${CONTROL_TOKEN}@github.com/market-predictions/control-engine.git" "$repo"
          [ "$(git -C "$repo" rev-parse HEAD)" = "$parent" ]
          python - "$repo/$file" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1]); text=path.read_text(encoding='utf-8')
          old='    assert "exactly one designated CI run identity is required" in text\n'
          new='    assert "if len(ids) == 1:" in text\n    assert "exactly one designated CI run identity is required" not in text\n'
          if text.count(old) != 1:
              raise SystemExit('missing-CI regression assertion mismatch')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git -C "$repo" diff --check
          [ "$(git -C "$repo" diff --name-only)" = "$file" ]
          git -C "$repo" config user.name 'control-canonical-b1[bot]'
          git -C "$repo" config user.email 'control-canonical-b1[bot]@users.noreply.github.com'
          git -C "$repo" add -- "$file"
          git -C "$repo" commit --quiet -m 'test: expect missing-CI terminal normalization'
          [ "$(git -C "$repo" rev-parse HEAD^)" = "$parent" ]
          git -C "$repo" push --quiet origin HEAD:refs/heads/main
          echo "PUBLIC_MAIN_SHA=$(git -C "$repo" rev-parse HEAD)"
