name: Retired Worker B Recovery Wake Bridge V1

# RETIRED 2026-08-24.
# No bridge may dispatch a legacy/provider B semantic executor. Canonical B1
# lifecycle is owned by Control and semantic execution is only the active
# deterministic STANDARD/DEEP profile.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement-proof:
    if: github.repository == 'market-predictions/control-engine'
    runs-on: ubuntu-latest
    steps:
      - name: Prove recovery wake bridge is non-executable
        shell: bash
        run: |
          set -euo pipefail
          echo 'CONTROL_WORKER_B_RECOVERY_WAKE_BRIDGE_V1=RETIRED'
          echo 'WORKFLOW_DISPATCH_TO_PROVIDER_B=false'
          echo 'ACTIONS_WRITE=false'
          echo 'PROVIDER_FALLBACK=false'
