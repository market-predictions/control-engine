name: Worker B Recovery Wake Bridge V1

# Legacy provider-B wake bridge retained for explicit manual recovery only.
# Normal consequential B1 execution is Canonical B1 Dual Executor V1.
# No workflow_run or push trigger: this bridge must never race canonical B1.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: control-worker-b-wake-bridge-v1
  cancel-in-progress: false

jobs:
  wake-b-recovery:
    if: github.repository == 'market-predictions/control-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Legacy Provider B Recovery V2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/scheduled-worker-b-v2.yml/dispatches" \
            -f ref=main
