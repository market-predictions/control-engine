name: Validate Private Control Authority

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate exact private validation request
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)

          body = event.get("comment", {}).get("body", "")
          common = (
              event.get("repository", {}).get("full_name") == "market-predictions/control-engine"
              and event.get("comment", {}).get("user", {}).get("login") == "market-predictions"
              and isinstance(body, str)
          )

          prefix = "CONTROL_PRIVATE_V31_VALIDATE "
          authorized = (
              common
              and event.get("issue", {}).get("number") == 87
              and body.startswith(prefix)
          )
          sha = body[len(prefix):] if authorized else ""
          profile = "V31" if authorized else ""
          base_ref = "main" if authorized else ""

          if not authorized:
              v4_prefix = "CONTROL_PRIVATE_V4_VALIDATE "
              v4_payload = body[len(v4_prefix):] if common and body.startswith(v4_prefix) else ""
              v4_parts = v4_payload.split(" ") if v4_payload else []
              v4_authorized = (
                  common
                  and event.get("issue", {}).get("number") == 106
                  and len(v4_parts) == 2
                  and all(re.fullmatch(r"[0-9a-f]{40}", part) is not None for part in v4_parts)
              )
              if v4_authorized:
                  sha, base_ref = v4_parts
                  profile = "V4"
                  authorized = True

          if profile == "V31":
              authorized = re.fullmatch(r"[0-9a-f]{40}", sha) is not None
          elif profile == "V4":
              authorized = (
                  re.fullmatch(r"[0-9a-f]{40}", sha) is not None
                  and re.fullmatch(r"[0-9a-f]{40}", base_ref) is not None
                  and sha != base_ref
              )
          else:
              authorized = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"authorized={'true' if authorized else 'false'}\n")
              if authorized:
                  output.write(f"sha={sha}\n")
                  output.write(f"profile={profile}\n")
                  output.write(f"base_ref={base_ref}\n")
          print("CONTROL_PRIVATE_EVENT_GATE=" + (f"AUTHORIZED_{profile}" if authorized else "IGNORED"))
          PY

      - name: Checkout trusted validator from public main
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Setup trusted Python runtime
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install trusted schema validator
        if: steps.gate.outputs.authorized == 'true'
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Preflight GitHub App read capability
        if: steps.gate.outputs.authorized == 'true'
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create read-only private candidate capability
        if: steps.gate.outputs.authorized == 'true'
        id: private-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: market-predictions
          repositories: control-plane
          permission-contents: read

      - name: Checkout exact private candidate as data
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: market-predictions/control-plane
          ref: ${{ steps.gate.outputs.sha }}
          token: ${{ steps.private-token.outputs.token }}
          path: private-candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private comparison authority as data
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: market-predictions/control-plane
          ref: ${{ steps.gate.outputs.base_ref }}
          token: ${{ steps.private-token.outputs.token }}
          path: private-base
          persist-credentials: false
          fetch-depth: 0

      - name: Validate candidate with trusted public code and schemas only
        if: steps.gate.outputs.authorized == 'true'
        shell: bash
        env:
          VALIDATION_PROFILE: ${{ steps.gate.outputs.profile }}
        run: |
          set -euo pipefail
          if [ "$VALIDATION_PROFILE" = "V31" ]; then
            python -m py_compile scripts/validate_private_control_v31.py
            python scripts/validate_private_control_v31.py private-candidate private-base
          elif [ "$VALIDATION_PROFILE" = "V4" ]; then
            python -m py_compile scripts/validate_private_control_v4.py
            python scripts/validate_private_control_v4.py private-candidate private-base
          else
            echo 'unsupported private validation profile' >&2
            exit 2
          fi

      - name: Prove read-only carrier boundary
        if: ${{ always() && steps.gate.outputs.authorized == 'true' }}
        run: |
          echo 'CONTROL_PRIVATE_CANDIDATE_EXECUTION=false'
          echo 'CONTROL_PRIVATE_RUNTIME_MUTATION=false'
          echo 'CONTROL_PRIVATE_VALIDATOR_SOURCE=PUBLIC_MAIN'
          echo 'CONTROL_PRIVATE_SCHEMA_AUTHORITY=PUBLIC_MAIN'
          echo 'CONTROL_PRIVATE_VALIDATION_PROFILE=${{ steps.gate.outputs.profile }}'
          echo 'CONTROL_PRIVATE_VALIDATED_BASE=${{ steps.gate.outputs.base_ref }}'
