name: Gate-8 R18 Repair Publish V1

on:
  push:
    branches:
      - control/199-g8-h13-b1-lifecycle-actuator-v1
    paths:
      - .github/workflows/g8-r18-repair-publish-v1.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: control-199-g8-r18-repair-publish-v1
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: market-predictions/control-engine
  TARGET_BRANCH: control/199-g8-b1-profile-activation-v1
  EXPECTED_HEAD: 3c4c049140bc7763e11ac750103982cb1ddaae35

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated actuator branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight GitHub App
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create narrowly scoped implementation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: control-engine
          permission-contents: 'write'
          permission-workflows: 'write'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply test and publish exact R18
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CONTROL_TOKEN"
          url="https://x-access-token:${CONTROL_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          repo="$RUNNER_TEMP/candidate"
          git clone --quiet --single-branch --branch "$TARGET_BRANCH" "$url" "$repo"
          [ "$(git -C "$repo" rev-parse HEAD)" = "$EXPECTED_HEAD" ]

          python .control/g8_r18_apply_v1.py "$repo"
          cd "$repo"
          [ "$(git diff --name-only)" = $'.github/workflows/canonical-b1-dual-executor-v1.yml\ntests/test_canonical_b1_dual_executor_v1.py' ]
          git diff --check
          python -m pip install --disable-pip-version-check -q pytest
          python -m py_compile scripts/canonical_b1_dual_executor_v1.py tests/test_canonical_b1_dual_executor_v1.py
          python -m pytest -q tests/test_canonical_b1_dual_executor_v1.py

          git config user.name 'control-chatgpt-a1[bot]'
          git config user.email 'control-chatgpt-a1[bot]@users.noreply.github.com'
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          git add -- .github/workflows/canonical-b1-dual-executor-v1.yml tests/test_canonical_b1_dual_executor_v1.py
          git commit -m 'fix: scope B1 CI workflow identity to selected repo'
          [ "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD" ]
          git push "$url" "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "R18_CANDIDATE_SHA=$(git rev-parse HEAD)"
