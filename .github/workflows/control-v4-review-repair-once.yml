name: Control V4 Review Repair Once

on:
  push:
    branches:
      - control/117-v4-runtime-carrier

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.repository == 'market-predictions/control-engine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: control/117-v4-runtime-carrier
          fetch-depth: 0

      - name: Apply exact reviewed repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          script = 'scripts/control_v4_runtime_carrier.py'
          replace_exact(
              script,
              '''def _update_ref_exact(*, repository_node_id: str, before_oid: str, after_oid: str, client_id: str) -> None:\n''',
              '''def _update_refs_exact(\n    *,\n    repository_node_id: str,\n    main_oid: str,\n    runtime_before_oid: str,\n    runtime_after_oid: str,\n    client_id: str,\n) -> None:\n''',
          )
          replace_exact(
              script,
              '''                    "refUpdates": [{\n                        "name": f"refs/heads/{RUNTIME_BRANCH}",\n                        "beforeOid": before_oid,\n                        "afterOid": after_oid,\n                        "force": False,\n                    }],\n''',
              '''                    "refUpdates": [\n                        {\n                            "name": "refs/heads/main",\n                            "beforeOid": main_oid,\n                            "afterOid": main_oid,\n                            "force": False,\n                        },\n                        {\n                            "name": f"refs/heads/{RUNTIME_BRANCH}",\n                            "beforeOid": runtime_before_oid,\n                            "afterOid": runtime_after_oid,\n                            "force": False,\n                        },\n                    ],\n''',
          )
          replace_exact(
              script,
              '''        raise StaleWriteError("exact private runtime ref update rejected")\n''',
              '''        raise StaleWriteError("exact private authority/runtime ref update rejected")\n''',
          )
          replace_exact(
              script,
              '''    _update_ref_exact(\n        repository_node_id=state["repository_node_id"],\n        before_oid=state["runtime_sha"],\n        after_oid=new_commit,\n        client_id=f"control-v4-runtime-{os.environ.get('GITHUB_RUN_ID', 'unknown')}-{reason}",\n    )\n''',
              '''    _update_refs_exact(\n        repository_node_id=state["repository_node_id"],\n        main_oid=state["main_sha"],\n        runtime_before_oid=state["runtime_sha"],\n        runtime_after_oid=new_commit,\n        client_id=f"control-v4-runtime-{os.environ.get('GITHUB_RUN_ID', 'unknown')}-{reason}",\n    )\n''',
          )
          marker = '''    event = command["event"]\n\n    if event == "YIELD":\n'''
          replacement = '''    event = command["event"]\n\n    review_events_requiring_live_candidate = {\n        "INTERNAL_PASS",\n        "INTERNAL_REPAIR",\n        "EXTERNAL_REQUESTED",\n        "EXTERNAL_FINDING",\n        "EXTERNAL_PASS",\n        "REVIEW_UNAVAILABLE",\n    }\n    if (\n        event in review_events_requiring_live_candidate\n        and task.get("status") == "ACTIVE"\n        and task.get("phase") == "REVIEW"\n        and isinstance(task.get("candidate"), Mapping)\n    ):\n        live_candidate = _target_pr_candidate(task["repository"], task["candidate"]["candidate_pr_number"])\n        reconciled, drifted = reconcile_review_candidate_drift_v4(\n            queue,\n            task_id=command["task_id"],\n            run_id=command["run_id"],\n            live_candidate=live_candidate,\n            now=now,\n        )\n        if drifted:\n            state = _write_queue_exact(state, reconciled, reason="candidate-drift-to-repair")\n            return state, safe_work_capsule(\n                state["queue"],\n                task_id=command["task_id"],\n                run_id=command["run_id"],\n                live_candidate=live_candidate,\n            )\n\n    if event == "YIELD":\n'''
          replace_exact(script, marker, replacement)

          protocol = 'control_engine/v4_runtime_protocol.py'
          replace_exact(
              protocol,
              '''    "execution_lock",\n    "queue",\n''',
              '''    "execution_lock",\n    "lock_expires_at",\n    "queue",\n''',
          )
          replace_exact(
              protocol,
              '''        "repository": task["repository"],\n        "lock_expires_at": lock["expires_at"],\n    }\n''',
              '''        "repository": task["repository"],\n    }\n''',
          )

          workflow_test = 'tests/test_v4_runtime_carrier_workflow.py'
          replace_exact(
              workflow_test,
              '''from pathlib import Path\n\n\nWORKFLOW = Path''',
              '''from pathlib import Path\n\nimport pytest\n\nimport scripts.control_v4_runtime_carrier as carrier\n\n\nWORKFLOW = Path''',
          )
          replace_exact(
              workflow_test,
              '''    assert '"beforeOid": before_oid' in text\n    assert '"afterOid": after_oid' in text\n''',
              '''    assert '"name": "refs/heads/main"' in text\n    assert '"beforeOid": main_oid' in text\n    assert '"afterOid": main_oid' in text\n    assert '"beforeOid": runtime_before_oid' in text\n    assert '"afterOid": runtime_after_oid' in text\n''',
          )
          insert_after = '''    assert 'mandatory private queue readback failed' in text\n\n\n'''
          atomic_test = '''def test_atomic_main_and_runtime_ref_cas_rejects_authority_interleaving_without_runtime_move(monkeypatch) -> None:\n    main_a = "a" * 40\n    main_b = "b" * 40\n    runtime_a = "c" * 40\n    runtime_b = "d" * 40\n    runtime_ref = f"refs/heads/{carrier.RUNTIME_BRANCH}"\n    refs = {"refs/heads/main": main_b, runtime_ref: runtime_a}\n\n    def fake_request_json(url, *, headers=None, method="GET", payload=None, allow_404=False):\n        assert url == carrier.GRAPHQL\n        assert method == "POST"\n        updates = payload["variables"]["input"]["refUpdates"]\n        assert updates == [\n            {"name": "refs/heads/main", "beforeOid": main_a, "afterOid": main_a, "force": False},\n            {"name": runtime_ref, "beforeOid": runtime_a, "afterOid": runtime_b, "force": False},\n        ]\n        if any(refs[update["name"]] != update["beforeOid"] for update in updates):\n            return {"errors": [{"message": "stale ref"}]}\n        next_refs = dict(refs)\n        for update in updates:\n            next_refs[update["name"]] = update["afterOid"]\n        refs.update(next_refs)\n        return {"data": {"updateRefs": {"clientMutationId": "test"}}}\n\n    monkeypatch.setattr(carrier, "_private_headers", lambda: {})\n    monkeypatch.setattr(carrier, "_request_json", fake_request_json)\n\n    with pytest.raises(carrier.StaleWriteError):\n        carrier._update_refs_exact(\n            repository_node_id="repo-node",\n            main_oid=main_a,\n            runtime_before_oid=runtime_a,\n            runtime_after_oid=runtime_b,\n            client_id="test",\n        )\n\n    assert refs["refs/heads/main"] == main_b\n    assert refs[runtime_ref] == runtime_a\n\n\n'''
          replace_exact(workflow_test, insert_after, insert_after + atomic_test)

          protocol_test = 'tests/test_v4_runtime_protocol.py'
          replace_exact(
              protocol_test,
              '''import pytest\n\nfrom control_engine.v4_runtime_protocol import (\n''',
              '''import pytest\n\nimport scripts.control_v4_runtime_carrier as carrier\nfrom control_engine.v4_runtime_protocol import (\n''',
          )
          replace_exact(
              protocol_test,
              '''        "execution_lock",\n    ):\n        assert forbidden not in encoded\n\n\n''',
              '''        "execution_lock",\n        "lock_expires_at",\n    ):\n        assert forbidden not in encoded\n    assert q["execution_lock"]["expires_at"] not in encoded\n\n\n''',
          )
          drift_test = '''def test_carrier_review_pass_events_recheck_live_candidate_before_applying_pass(monkeypatch) -> None:\n    for event, extra, seeded in (\n        ("INTERNAL_PASS", {}, queue(task(candidate_value=candidate(), last_review=None, external_review=None))),\n        (\n            "EXTERNAL_PASS",\n            {"evidence_ref": "https://github.com/example/repo/pull/120#issuecomment-2"},\n            active_external_queue(),\n        ),\n    ):\n        state = {"queue": seeded, "runtime_enabled": True, "integration_enabled": False}\n        parsed = parse_public_command(event_body(seeded, event, **extra))\n        writes = []\n\n        def fake_write(current_state, next_queue, *, reason):\n            writes.append((deepcopy(next_queue), reason))\n            return {**current_state, "queue": deepcopy(next_queue)}\n\n        monkeypatch.setattr(carrier, "_target_pr_candidate", lambda repository, pr_number: candidate(NEW_SHA))\n        monkeypatch.setattr(carrier, "_write_queue_exact", fake_write)\n\n        _, result = carrier._event(parsed, state, now=NOW)\n\n        assert writes == [(writes[0][0], "candidate-drift-to-repair")]\n        current = writes[0][0]["tasks"][0]\n        assert current["phase"] == "REPAIR"\n        assert current["candidate"]["candidate_sha"] == OLD_SHA\n        if event == "INTERNAL_PASS":\n            assert current["last_review"] is None\n        else:\n            assert current["external_review"]["status"] == "PENDING"\n        assert result["action"] == "REPAIR"\n        assert result["live_candidate"]["candidate_sha"] == NEW_SHA\n\n\n'''
          replace_exact(
              protocol_test,
              '''def test_weeu_shape_candidate_drift_requires_no_external_review_and_goes_to_same_task_repair() -> None:\n''',
              drift_test + '''def test_weeu_shape_candidate_drift_requires_no_external_review_and_goes_to_same_task_repair() -> None:\n''',
          )

          Path('.github/workflows/control-v4-review-repair-once.yml').unlink()
          PY

      - name: Run focused and full regressions
        run: |
          python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1
          python -m pytest -q tests/test_v4_runtime_carrier_workflow.py tests/test_v4_runtime_protocol.py
          python -m pytest -q

      - name: Commit exact repair and self-cleanup
        run: |
          set -euo pipefail
          git config user.name "market-predictions"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/control_v4_runtime_carrier.py control_engine/v4_runtime_protocol.py tests/test_v4_runtime_carrier_workflow.py tests/test_v4_runtime_protocol.py .github/workflows/control-v4-review-repair-once.yml
          git diff --cached --check
          git commit -m "V4: close runtime authority, drift, and privacy races"
          git push origin HEAD:control/117-v4-runtime-carrier
