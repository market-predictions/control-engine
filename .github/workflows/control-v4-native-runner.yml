name: Control V4 Native Runner
run-name: Control V4 native runner ${{ github.run_id }}.${{ github.run_attempt }}

on:
  schedule:
    - cron: '30 * * * *'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: control-v4-native-runner
  cancel-in-progress: false

jobs:
  runner:
    if: >-
      ${{
        github.repository == 'market-predictions/control-engine' &&
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'schedule' ||
          (
            github.event_name == 'issue_comment' &&
            github.event.action == 'created' &&
            github.actor == 'market-predictions' &&
            github.triggering_actor == 'market-predictions' &&
            github.event.issue.number == 106 &&
            github.event.issue.pull_request == null &&
            github.event.comment.body == 'CONTROL_V4_NATIVE_PROOF'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted Control Engine main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Create exact private runtime capability
        id: private-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: market-predictions
          repositories: control-plane
          permission-contents: write

      - name: Acquire at most one current WORK item
        id: acquire
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_PLANE_TOKEN: ${{ steps.private-token.outputs.token }}
          CONTROL_ENGINE_TOKEN: ${{ github.token }}
          CONTROL_NATIVE_MODE: acquire
        run: python scripts/control_v4_native_runner.py

      - name: Create exact target capability
        id: target-token
        if: ${{ steps.acquire.outputs.result == 'WORK' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.acquire.outputs.repository_owner }}
          repositories: ${{ steps.acquire.outputs.repository_name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout exact reviewed free-model runtime pins
        if: ${{ steps.acquire.outputs.result == 'WORK' && steps.acquire.outputs.semantic == 'true' && steps.target-token.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: market-predictions/agent
          ref: 15a6436e0c4563bd5aace52d9c124bc544f6c0dc
          path: .agent-runtime
          persist-credentials: false

      - name: Start ephemeral FreeLLMAPI only for semantic WORK
        id: free-model
        if: ${{ steps.acquire.outputs.result == 'WORK' && steps.acquire.outputs.semantic == 'true' && steps.target-token.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/.agent-runtime"
          IMAGE="$(python -c 'import runtime_versions; print(runtime_versions.FREELLMAPI_IMAGE)')"
          docker pull "$IMAGE"
          ENCRYPTION_KEY="$(printf 'a%.0s' $(seq 1 64))"
          FREELLMAPI_API_KEY="freellmapi-control-${GITHUB_RUN_ID}"
          docker run --rm -d             --name control-freeapi             -p 3001:3001             -e ENCRYPTION_KEY="$ENCRYPTION_KEY"             -e FREELLMAPI_API_KEY="$FREELLMAPI_API_KEY"             -e FREEAPI_CONFIG_PATH=/app/agent-freellmapi-default.json             -v "$GITHUB_WORKSPACE/.agent-runtime/runtime/freellmapi-bootstrap.mjs:/app/agent-freellmapi-bootstrap.mjs:ro"             -v "$GITHUB_WORKSPACE/.agent-runtime/runtime/freellmapi.default.json:/app/agent-freellmapi-default.json:ro"             "$IMAGE"             sh -lc 'node /app/agent-freellmapi-bootstrap.mjs >/dev/null && exec node server/dist/index.js'
          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3001/api/ping >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ]
          {
            echo "FREELLMAPI_BASE_URL=http://127.0.0.1:3001/v1"
            echo "FREELLMAPI_API_KEY=$FREELLMAPI_API_KEY"
          } >> "$GITHUB_ENV"

      - name: Process exact WORK and close holder
        id: process
        if: ${{ always() && steps.acquire.outputs.result == 'WORK' && steps.target-token.outcome == 'success' }}
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_PLANE_TOKEN: ${{ steps.private-token.outputs.token }}
          CONTROL_ENGINE_TOKEN: ${{ github.token }}
          CONTROL_TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          CONTROL_NATIVE_MODE: process
          CONTROL_NATIVE_WORK: ${{ steps.acquire.outputs.result_json }}
        run: python scripts/control_v4_native_runner.py

      - name: Close holder if target capability or processing failed
        id: emergency-yield
        if: >-
          ${{
            always() &&
            steps.acquire.outputs.result == 'WORK' &&
            (
              steps.target-token.outcome != 'success' ||
              steps.process.outcome != 'success'
            )
          }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          CONTROL_PLANE_TOKEN: ${{ steps.private-token.outputs.token }}
          CONTROL_ENGINE_TOKEN: ${{ github.token }}
          CONTROL_NATIVE_MODE: yield
          CONTROL_NATIVE_WORK: ${{ steps.acquire.outputs.result_json }}
        run: python scripts/control_v4_native_runner.py

      - name: Stop ephemeral free-model container
        if: ${{ always() }}
        run: docker rm -f control-freeapi >/dev/null 2>&1 || true

      - name: Publish public-safe native audit result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACQUIRE_RESULT: ${{ steps.acquire.outputs.result_json }}
          PROCESS_RESULT: ${{ steps.process.outputs.result_json }}
          YIELD_RESULT: ${{ steps.emergency-yield.outputs.result_json }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          def parse(name):
              raw = os.environ.get(name, "")
              if not raw:
                  return None
              value = json.loads(raw)
              if not isinstance(value, dict):
                  raise SystemExit("native audit result invalid")
              return value

          acquire = parse("ACQUIRE_RESULT")
          process = parse("PROCESS_RESULT")
          emergency = parse("YIELD_RESULT")
          final = emergency or process or acquire or {"result": "WORKFLOW_SETUP_FAILURE"}
          public = {
              "protocol": "CONTROL_V4_NATIVE_AUDIT_V1",
              "workflow_event": os.environ.get("EVENT_NAME"),
              "run_id": final.get("run_id") or (acquire or {}).get("run_id"),
              "result": final.get("result"),
              "acquire_result": (acquire or {}).get("result"),
          }
          if isinstance((acquire or {}).get("repository"), str):
              public["repository"] = acquire["repository"]
          if isinstance((acquire or {}).get("action"), str):
              public["action"] = acquire["action"]
          body = "CONTROL_V4_NATIVE_RUN_RESULT " + json.dumps(
              public, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/106/comments",
              data=json.dumps({"body": body}, separators=(",", ":")).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "control-v4-native-audit",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if not isinstance(result.get("id"), int):
              raise SystemExit("native audit publication failed")
          PY
