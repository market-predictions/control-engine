name: Gate-8 H6 B1 Completion Actuator V1

# Temporary deterministic lifecycle-only actuator for the already START_PROVEN H6 claim.
# It can renew the same exact claim or persist/finalize one exact externally supplied
# semantic verdict. It performs no semantic inference and cannot merge or activate Gate 8.

on:
  push:
    branches:
      - control/199-g8-h6-b1-lifecycle-actuator-v1
    paths:
      - .control/g8-h6-b1-completion-command.json
      - .github/workflows/g8-h6-b1-completion-actuator-v1.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: control-199-g8-h6-b1-completion-actuator-v1
  cancel-in-progress: false

env:
  CONTROL_PLANE_REPOSITORY: market-predictions/control-plane
  CONTROL_RUNTIME_REF: control-runtime-state
  CONTROL_B_CODE_REF: runtime/public-b-v2-code-r2
  CONTROL_B_CODE_SHA: 97ef7de0007b4886e336182c7a9a0ee20ae77455
  CONTROL_TASK_ID: CONTROL-199-G8-B1-PROFILE-ACTIVATION-ASSURE-H6
  CONTROL_CANDIDATE_SHA: e91f80a7cc079979511b80a578020d72bcb436cc

jobs:
  lifecycle:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/control/199-g8-h6-b1-lifecycle-actuator-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated lifecycle branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact command envelope
        id: command
        shell: bash
        run: |
          set -euo pipefail
          file=.control/g8-h6-b1-completion-command.json
          jq -e '
            .version == "1.0" and
            (.action == "hold" or .action == "renew" or .action == "complete") and
            .task_id == env.CONTROL_TASK_ID and
            .candidate_sha == env.CONTROL_CANDIDATE_SHA and
            (.nonce | type == "string") and (.nonce | length > 0)
          ' "$file" >/dev/null
          action="$(jq -r '.action' "$file")"
          if [ "$action" = hold ]; then
            jq -e '(keys | sort) == (["action","candidate_sha","nonce","task_id","version"] | sort)' "$file" >/dev/null
          elif [ "$action" = renew ]; then
            jq -e '(.active_run_id | type == "string") and (.active_run_id | test("^run-[0-9a-f-]+$")) and (keys | sort) == (["action","active_run_id","candidate_sha","nonce","task_id","version"] | sort)' "$file" >/dev/null
          else
            jq -e '(.active_run_id | type == "string") and (.active_run_id | test("^run-[0-9a-f-]+$")) and (.review_comment_id | type == "number") and .review_comment_id > 0 and (keys | sort) == (["action","active_run_id","candidate_sha","nonce","review_comment_id","task_id","version"] | sort)' "$file" >/dev/null
          fi
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"

      - name: Hold without private mutation
        if: steps.command.outputs.action == 'hold'
        run: echo 'G8_H6_B1_COMPLETION=HOLD'

      - name: Preflight GitHub App identity and installation
        if: steps.command.outputs.action != 'hold'
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived Control token
        id: app-token
        if: steps.command.outputs.action != 'hold'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'write'
          permission-issues: 'read'

      - name: Setup Python
        if: steps.command.outputs.action != 'hold'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Fetch exact pinned B lifecycle code
        if: steps.command.outputs.action != 'hold'
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CONTROL_TOKEN"
          private_url="https://x-access-token:${CONTROL_TOKEN}@github.com/${CONTROL_PLANE_REPOSITORY}.git"
          b_code="$RUNNER_TEMP/control-b-code"
          git clone --quiet --single-branch --branch "$CONTROL_B_CODE_REF" "$private_url" "$b_code"
          [ "$(git -C "$b_code" rev-parse HEAD)" = "$CONTROL_B_CODE_SHA" ]
          printf 'CONTROL_B_CODE_DIR=%s\n' "$b_code" >> "$GITHUB_ENV"
          printf 'CONTROL_PRIVATE_URL=%s\n' "$private_url" >> "$GITHUB_ENV"

      - name: Renew same exact current H6 claim
        if: steps.command.outputs.action == 'renew'
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          active_run_id="$(jq -r '.active_run_id' .control/g8-h6-b1-completion-command.json)"
          renewed=false
          for cas_attempt in 1 2 3; do
            state="$RUNNER_TEMP/renew-${cas_attempt}"
            rm -rf "$state"
            git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$CONTROL_PRIVATE_URL" "$state"
            git -C "$state" config user.name 'control-g8-h6-b1-lifecycle[bot]'
            git -C "$state" config user.email 'control-g8-h6-b1-lifecycle[bot]@users.noreply.github.com'
            observed_ref="$(git -C "$state" rev-parse HEAD)"
            observed_blob="$(git -C "$state" rev-parse 'HEAD:control/DISPATCH_QUEUE.json')"

            PYTHONPATH="$CONTROL_B_CODE_DIR" python - "$state/control/DISPATCH_QUEUE.json" "$active_run_id" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from tools.control_parallel_execution_v1 import renew_claim, validate_parallel_queue
          from tools.control_queue_v1 import ROLE_B
          path = Path(sys.argv[1])
          run_id = sys.argv[2]
          queue = json.loads(path.read_text(encoding='utf-8'))
          task_id = os.environ['CONTROL_TASK_ID']
          candidate = os.environ['CONTROL_CANDIDATE_SHA']
          matches = [t for t in queue['tasks'] if t.get('task_id') == task_id]
          if len(matches) != 1 or matches[0].get('candidate_sha') != candidate:
              raise SystemExit('H6 identity mismatch')
          before_attempt = matches[0].get('attempt')
          before_count = matches[0].get('claim_count')
          queue = renew_claim(queue, task_id=task_id, role=ROLE_B, worker_instance='B1', run_id=run_id, now=datetime.now(timezone.utc), lease_seconds=900)
          task = [t for t in queue['tasks'] if t.get('task_id') == task_id][0]
          if task.get('attempt') != before_attempt or task.get('claim_count') != before_count:
              raise SystemExit('renew changed attempt or claim_count')
          validate_parallel_queue(queue)
          path.write_text(json.dumps(queue, indent=2) + '\n', encoding='utf-8')
          PY

            [ "$(git -C "$state" diff --name-only)" = 'control/DISPATCH_QUEUE.json' ]
            git -C "$state" fetch --quiet origin "refs/heads/${CONTROL_RUNTIME_REF}"
            [ "$(git -C "$state" rev-parse FETCH_HEAD)" = "$observed_ref" ] || continue
            [ "$(git -C "$state" rev-parse 'FETCH_HEAD:control/DISPATCH_QUEUE.json')" = "$observed_blob" ] || continue
            git -C "$state" add -- control/DISPATCH_QUEUE.json
            git -C "$state" commit --quiet -m 'runtime: renew Gate-8 H6 B1 claim'
            git -C "$state" push --quiet origin "HEAD:refs/heads/${CONTROL_RUNTIME_REF}" || continue
            renewed=true
            break
          done
          [ "$renewed" = true ]
          echo "G8_H6_B1_COMPLETION=LEASE_RENEWED"
          echo "G8_H6_B1_RUN_ID=$active_run_id"

      - name: Read and validate exact semantic result comment
        if: steps.command.outputs.action == 'complete'
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          command=.control/g8-h6-b1-completion-command.json
          comment_id="$(jq -r '.review_comment_id' "$command")"
          active_run_id="$(jq -r '.active_run_id' "$command")"
          result="$RUNNER_TEMP/h6-result.json"
          GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${CONTROL_PLANE_REPOSITORY}/issues/comments/${comment_id}" --jq '.body' > "$result"
          jq -e --arg task "$CONTROL_TASK_ID" --arg candidate "$CONTROL_CANDIDATE_SHA" --arg run "$active_run_id" '
            .version == "1.0" and
            .task_id == $task and
            .run_id == $run and
            .role == "governance_release_assurance" and
            (.outcome == "PASS" or .outcome == "FAIL" or .outcome == "INDETERMINATE") and
            .candidate_sha == $candidate and
            (.summary | type == "string") and
            (.findings | type == "array") and all(.findings[]; type == "string") and
            (.evidence | type == "array") and all(.evidence[]; type == "string") and
            (keys | sort) == (["candidate_sha","evidence","findings","outcome","role","run_id","summary","task_id","version"] | sort)
          ' "$result" >/dev/null
          printf 'ACTIVE_RUN_ID=%s\n' "$active_run_id" >> "$GITHUB_ENV"
          printf 'REVIEWER_RESULT=%s\n' "$result" >> "$GITHUB_ENV"

      - name: Complete same exact H6 claim through connected runtime
        if: steps.command.outputs.action == 'complete'
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          success=false
          for cas_attempt in 1 2 3; do
            state="$RUNNER_TEMP/complete-${cas_attempt}"
            rm -rf "$state"
            git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$CONTROL_PRIVATE_URL" "$state"
            set +e
            GH_TOKEN="$CONTROL_TOKEN" PYTHONPATH="$CONTROL_B_CODE_DIR" \
              python "$CONTROL_B_CODE_DIR/tools/control_connected_worker_runtime_v1.py" complete \
                --runtime-root "$state" \
                --runtime-ref "$CONTROL_RUNTIME_REF" \
                --github-repository "$CONTROL_PLANE_REPOSITORY" \
                --task-id "$CONTROL_TASK_ID" \
                --worker-instance B1 \
                --active-run-id "$ACTIVE_RUN_ID" \
                --result "$REVIEWER_RESULT" \
                > "$RUNNER_TEMP/complete-${cas_attempt}.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" = 0 ]; then success=true; break; fi
            if grep -q 'CONTROL_RUNTIME_CAS_CONFLICT' "$RUNNER_TEMP/complete-${cas_attempt}.log"; then continue; fi
            cat "$RUNNER_TEMP/complete-${cas_attempt}.log"
            exit 2
          done
          [ "$success" = true ]
          final="$RUNNER_TEMP/final"
          git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$CONTROL_PRIVATE_URL" "$final"
          jq -e --arg task "$CONTROL_TASK_ID" '
            [.tasks[] | select(.task_id == $task)] | length == 1 and
            (.[0].active_run_id == null) and
            (.[0].active_role == null) and
            (.[0].active_worker_instance == null)
          ' "$final/control/DISPATCH_QUEUE.json" >/dev/null
          echo 'G8_H6_B1_COMPLETION=TERMINAL_GHOST_FREE'
          echo "G8_H6_B1_RUN_ID=$ACTIVE_RUN_ID"
