name: Cloudflare B1 Shadow Calibration V1

on:
  pull_request:
    paths:
      - 'control_engine/cloudflare_b1.py'
      - 'scripts/cloudflare_b1_shadow.py'
      - 'fixtures/cloudflare_b1_shadow_*.json'
      - 'tests/test_cloudflare_b1.py'
      - '.github/workflows/cloudflare-b1-shadow-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-calibration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact shadow candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run non-authoritative three-case calibration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CONTROL_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CONTROL_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          unavailable=0
          mismatch=0
          false_pass=0
          for fixture in \
            fixtures/cloudflare_b1_shadow_pass.json \
            fixtures/cloudflare_b1_shadow_fail.json \
            fixtures/cloudflare_b1_shadow_indeterminate.json
          do
            set +e
            output="$(python scripts/cloudflare_b1_shadow.py "$fixture" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            case "$rc" in
              0) ;;
              75) unavailable=1 ;;
              4) false_pass=1 ;;
              *) mismatch=1 ;;
            esac
          done
          if [ "$false_pass" = 1 ]; then
            echo 'CLOUDFLARE_B1_SHADOW=FALSE_PASS'
            exit 1
          fi
          if [ "$mismatch" = 1 ]; then
            echo 'CLOUDFLARE_B1_SHADOW=VERDICT_MISMATCH'
            exit 1
          fi
          if [ "$unavailable" = 1 ]; then
            echo 'CLOUDFLARE_B1_SHADOW=EXECUTION_UNAVAILABLE'
            exit 0
          fi
          echo 'CLOUDFLARE_B1_SHADOW=CALIBRATION_PASS'
