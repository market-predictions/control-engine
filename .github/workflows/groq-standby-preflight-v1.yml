name: Retired Groq Standby Preflight V1

# RETIRED 2026-08-24.
# The active B1 profile has no provider/model fallback: STANDARD is the pinned
# Cloudflare executor and DEEP is native Codex review. Groq standby/recovery
# qualification is therefore non-authoritative and non-executable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement-proof:
    if: github.repository == 'market-predictions/control-engine'
    runs-on: ubuntu-latest
    steps:
      - name: Prove Groq standby is retired
        shell: bash
        run: |
          set -euo pipefail
          echo 'CONTROL_GROQ_STANDBY_PREFLIGHT_V1=RETIRED'
          echo 'GROQ_PROVIDER_CALL=false'
          echo 'PROVIDER_FALLBACK=false'
          echo 'MODEL_FALLBACK=false'
          echo 'PAID_FALLBACK=false'
