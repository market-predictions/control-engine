name: Groq Standby Preflight V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/groq-standby-preflight-v1.yml'

permissions:
  contents: read
  statuses: write

jobs:
  groq-standby-preflight:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact public probe code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight GitHub App identity and installation
        id: app-preflight
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived read token for private Control code
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'read'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run queue-free Groq capability probe
        id: probe
        continue-on-error: true
        shell: bash
        env:
          CONTROL_GITHUB_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          GROQ_API_KEY: ${{ secrets.CONTROL_GROQ_API_KEY }}
          # Probe-only attestation: the exact pinned private provider policy below
          # independently enforces fresh FREE_FAIL_CLOSED policy/billing facts.
          CONTROL_GROQ_FREE_FAIL_CLOSED_ATTESTED: 'true'
          CONTROL_ATTEMPT_ID: groq-standby-preflight-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          CODE_REF='recovery/intake-immutable-result-collision-r1'
          CODE_SHA='7e0e9e218467c3090dbfcbb63a51a819cc19aba6'
          ROOT="${RUNNER_TEMP}/groq-standby-preflight"
          CODE_DIR="${ROOT}/code"
          mkdir -p "$CODE_DIR"
          trap 'rm -rf "$ROOT"' EXIT

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CONTROL_GITHUB_READ_TOKEN" | base64 -w0)"
          git -C "$CODE_DIR" init -q
          git -C "$CODE_DIR" remote add origin 'https://github.com/market-predictions/control-plane.git'
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" -C "$CODE_DIR" fetch --quiet --depth=1 origin "refs/heads/${CODE_REF}"
          git -C "$CODE_DIR" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$CODE_DIR" rev-parse HEAD)" = "$CODE_SHA"

          python - "$CODE_DIR/control/INFERENCE_PROVIDER_POLICY_V1.md" "$ROOT/groq-policy.md" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text(encoding='utf-8')
          old_cf = '## Cloudflare Workers AI Free — temporary assurance candidate (SAME_PROVIDER_CAPACITY_RECOVERY)'
          new_cf = '## Cloudflare Workers AI Free — temporary assurance standby (SAME_PROVIDER_CAPACITY_RECOVERY)'
          old_groq = '## Groq Free — provider-diverse standby'
          new_groq = '## Groq Free — provider-diverse assurance candidate'
          if source.count(old_cf) != 1 or source.count(old_groq) != 1:
              raise SystemExit('provider-policy probe anchors are not exact')
          Path(sys.argv[2]).write_text(source.replace(old_cf, new_cf).replace(old_groq, new_groq), encoding='utf-8')
          PY

          set +e
          python "$CODE_DIR/dispatcher/inference_worker.py" \
            --provider-policy "$ROOT/groq-policy.md" \
            --role assurance \
            --attempt-id "$CONTROL_ATTEMPT_ID" \
            --preflight-only \
            --output-file "$ROOT/result.json" \
            --metadata-file "$ROOT/metadata.json" \
            >"$ROOT/probe.log" 2>&1
          rc=$?
          set -e

          python - "$ROOT/metadata.json" "$rc" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          rc = int(sys.argv[2])
          meta = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          allowed = {
              'provider_id', 'model_id', 'billing_class', 'endpoint_class',
              'structured_final_mode', 'error_code', 'http_status',
              'provider_switches', 'secret_values_exposed'
          }
          safe = {k: meta.get(k) for k in sorted(allowed) if k in meta}
          print(f'probe_rc={rc}')
          print('safe_metadata=' + json.dumps(safe, separators=(',', ':')))
          print('error_code=' + str(meta.get('error_code') or 'NONE'))
          PY
          exit "$rc"

      - name: Publish sanitized Groq preflight status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROBE_RC: ${{ steps.probe.outputs.probe_rc }}
          ERROR_CODE: ${{ steps.probe.outputs.error_code }}
          SAFE_METADATA: ${{ steps.probe.outputs.safe_metadata }}
        run: |
          set -euo pipefail
          if [ "$PROBE_OUTCOME" = 'success' ] && [ "${PROBE_RC:-1}" = '0' ]; then
            state=success
            description=GROQ_STANDBY_PREFLIGHT_PASS
          else
            state=failure
            code="${ERROR_CODE:-UNKNOWN_WORKER_ERROR}"
            description="GROQ_STANDBY_PREFLIGHT_${code}"
          fi
          printf 'GROQ_STANDBY_PREFLIGHT=%s\n' "$description"
          printf 'SAFE_METADATA=%s\n' "${SAFE_METADATA:-{}}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="control/groq-preflight/${description}" \
            -f description="$description" >/dev/null
          test "$state" = success
