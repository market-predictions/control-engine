name: Private Control Deterministic Validation V1

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact market-predictions/control-plane candidate SHA
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: control-private-deterministic-validation-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event.comment.id }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'market-predictions/control-engine' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' ||
       (github.event.comment.user.login == 'market-predictions' &&
        startsWith(github.event.comment.body, 'CONTROL_PRIVATE_VALIDATE_V1 ')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted public carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight GitHub App identity and installation
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived private read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'read'

      - name: Resolve exact private candidate
        id: candidate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = issue_comment ]; then
            candidate_sha="${COMMENT_BODY#CONTROL_PRIVATE_VALIDATE_V1 }"
          else
            candidate_sha="$INPUT_CANDIDATE_SHA"
          fi
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'candidate_sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate exact private Control Minimal Core candidate without source leakage
        shell: bash
        env:
          CONTROL_GITHUB_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "::add-mask::$CONTROL_GITHUB_READ_TOKEN"
          root="$RUNNER_TEMP/private-control-validation"
          repo="$root/control-plane"
          log="$root/private-validation.log"
          mkdir -p "$repo" "$root/test-home" "$root/test-tmp"
          trap 'rm -rf "$root"' EXIT

          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CONTROL_GITHUB_READ_TOKEN" | base64 -w0)"
          git -C "$repo" init -q
          git -C "$repo" remote add origin 'https://github.com/market-predictions/control-plane.git'
          git -c "http.https://github.com/.extraheader=$auth_header" -C "$repo" fetch --quiet --depth=1 origin "$CANDIDATE_SHA"
          git -C "$repo" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "$CANDIDATE_SHA"

          # The private credential is fetch-only. Candidate code/tests never inherit it.
          unset CONTROL_GITHUB_READ_TOKEN auth_header

          set +e
          (
            # Re-enable fail-fast inside the captured validation subprocess. Without
            # this, an early failing check could be masked by a later success.
            set -euo pipefail
            cd "$repo"

            # Trusted/static checks run before any candidate-controlled Python test.
            # Candidate tests therefore cannot rewrite the trusted public validator
            # or private source in-memory and make a later structural check pass.
            python "$GITHUB_WORKSPACE/scripts/validate_retired_control_workflows.py" \
              .github/workflows/control-manual-run-delivery.yml \
              .github/workflows/control-zero-relay-dispatch.yml \
              .github/workflows/control-zero-relay-implementation.yml \
              .github/workflows/control-zero-relay-assurance.yml \
              .github/workflows/control-zero-relay-provider-preflight.yml

            python -m json.tool control/missions/SOLIDSECURITY.mission.json >/dev/null
            python -m json.tool control/missions/SOLID_PRIVACY_PLATFORM.mission.json >/dev/null
            python -m json.tool control/missions/WEEKLY_REVIEW_OS.mission.json >/dev/null

            grep -Fq 'runtime_model=CONTROL_MINIMAL_CORE_V1' control/SYSTEM_INDEX_V2.md
            grep -Fq 'status=SUPERSEDED_FOR_CONTROL_MINIMAL_CORE_V1' control/SYSTEM_INDEX.md
            grep -Fq 'current_claim_lease_seconds=5400' control/CONTROL_WORKER_LIVENESS_BOUNDARY_V1.md
            grep -Fq 'status=RETIRED_FOR_CONTROL_MINIMAL_CORE_V1' control/MISSION_RUNTIME_PUMP_V1.md
            grep -Fq 'status=SUPERSEDED_FOR_CONTROL_MINIMAL_CORE_V1' control/CONTROL_QUEUE_PROTOCOL_V1.md
            grep -Fq 'status=SUPERSEDED_FOR_CONTROL_MINIMAL_CORE_V1' control/CONTROL_TERMINAL_COMPLETION_V1.md
            grep -Fq 'runtime_execution_model=CONTROL_MINIMAL_CORE_V1' control/MISSION_SYSTEM_V1.md
            grep -Fq ':20  GitHub deterministic reconcile -> Feed queue' control/CONTROL_COMMAND_VOCABULARY_V1.md
            grep -Fq ':30  ChatGPT A1' control/CONTROL_COMMAND_VOCABULARY_V1.md
            grep -Fq ':35  ChatGPT A2' control/CONTROL_COMMAND_VOCABULARY_V1.md
            grep -Fq ':55  ChatGPT B1' control/CONTROL_COMMAND_VOCABULARY_V1.md

            grep -Fq 'mandatory_convergence_cleanup=true' control/SYSTEM_INDEX_V2.md
            grep -Fq 'mandatory_convergence_cleanup=true' control/CROSS_PROJECT_PRINCIPAL_AGENT_OPERATING_CHARTER_V1.md
            grep -Fq 'mandatory_convergence_cleanup=true' control/CROSS_PROJECT_TWO_ROLE_GOVERNANCE_STANDARD_V1.md
            grep -Fq 'mandatory_convergence_cleanup=true' control/PROJECT_PROMPT_INVOCATION_CONTRACT_V1.md
            grep -Fq '## Mandatory convergence-cleanup rule' control/PROJECT_BOOTSTRAP.md
            grep -Fq '1. `control/SYSTEM_INDEX_V2.md`;' control/PROJECT_BOOTSTRAP.md
            grep -Fq 'bounded stale-reference and competing-authority scan' control/SYSTEM_INDEX_V2.md
            grep -Fq 'B1 MUST treat the convergence-cleanup invariant as part of completeness' control/CROSS_PROJECT_TWO_ROLE_GOVERNANCE_STANDARD_V1.md
            ! grep -Fq '1. `control/SYSTEM_INDEX.md`' control/PROJECT_BOOTSTRAP.md
            ! grep -Fq '2. `control/CURRENT_STATE.md`' control/PROJECT_BOOTSTRAP.md
            ! grep -Fq '3. `control/NEXT_ACTIONS.md`' control/PROJECT_BOOTSTRAP.md

            # Compilation does not execute candidate modules. The only candidate-
            # controlled execution is the final focused unit-test phase below.
            python -m py_compile \
              tools/control_minimal_mission_feed_v1.py \
              tools/mission_contract_v1.py

            test -f tests/test_mission_contract_v1.py
            test -f tests/test_control_minimal_mission_feed_v1.py

            # Strip the GitHub runner environment before executing private tests.
            # No token, GITHUB_OUTPUT/ENV/PATH/SUMMARY file or other runner secret is
            # intentionally exposed to candidate-controlled Python.
            env -i \
              PATH="$PATH" \
              HOME="$root/test-home" \
              TMPDIR="$root/test-tmp" \
              PYTHONDONTWRITEBYTECODE=1 \
              python -m unittest discover -s tests -p 'test_mission_contract_v1.py' -v
            env -i \
              PATH="$PATH" \
              HOME="$root/test-home" \
              TMPDIR="$root/test-tmp" \
              PYTHONDONTWRITEBYTECODE=1 \
              python -m unittest discover -s tests -p 'test_control_minimal_mission_feed_v1.py' -v
          ) >"$log" 2>&1
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "CONTROL_PRIVATE_DETERMINISTIC_VALIDATION=FAIL profile=CONTROL_MINIMAL_CORE_V1 candidate_sha=$CANDIDATE_SHA"
            exit 1
          fi
          echo "CONTROL_PRIVATE_DETERMINISTIC_VALIDATION=PASS profile=CONTROL_MINIMAL_CORE_V1 candidate_sha=$CANDIDATE_SHA"
