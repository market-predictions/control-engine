name: Private Control Deterministic Validation V1
run-name: Control private candidate ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact market-predictions/control-plane candidate SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: control-private-deterministic-validation-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted public carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight GitHub App identity and installation
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived private read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'read'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate exact private Control candidate without public source leakage
        shell: bash
        env:
          CONTROL_GITHUB_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "::add-mask::$CONTROL_GITHUB_READ_TOKEN"
          root="$RUNNER_TEMP/private-control-validation"
          repo="$root/control-plane"
          log="$root/private-validation.log"
          mkdir -p "$repo"
          trap 'rm -rf "$root"' EXIT

          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CONTROL_GITHUB_READ_TOKEN" | base64 -w0)"
          git -C "$repo" init -q
          git -C "$repo" remote add origin 'https://github.com/market-predictions/control-plane.git'
          git -c "http.https://github.com/.extraheader=$auth_header" -C "$repo" fetch --quiet --depth=1 origin "$CANDIDATE_SHA"
          git -C "$repo" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "$CANDIDATE_SHA"

          set +e
          (
            cd "$repo"
            python -m unittest discover -s tests -p 'test_control_queue_v1.py' -v
            python -m unittest discover -s tests -p 'test_control_orchestration_v1.py' -v
            python -m unittest discover -s tests -p 'test_control_stale_queue_inertness_v1.py' -v
            python -m py_compile dispatcher/state.py tools/control_queue_v1.py tools/control_orchestration_v1.py tools/control_intake_inertness_v1.py
          ) >"$log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo 'CONTROL_PRIVATE_DETERMINISTIC_VALIDATION=FAIL'
            exit 1
          fi
          echo "CONTROL_PRIVATE_DETERMINISTIC_VALIDATION=PASS candidate_sha=$CANDIDATE_SHA"
