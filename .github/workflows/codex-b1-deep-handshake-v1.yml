name: Codex B1 Deep Handshake V1

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: codex-b1-deep-handshake-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  handshake:
    if: github.event.pull_request.number == 69
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      TASK_ID: CONTROL-199-CODEX-B1-HANDSHAKE
      HANDOVER_ID: CONTROL-199-CODEX-B1-HANDSHAKE-H1
    steps:
      - name: Checkout exact actuator candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate canary adapter
        run: |
          set -euo pipefail
          python -m py_compile control_engine/codex_b1.py scripts/codex_b1_canary.py
          python -m pytest -q tests/test_codex_b1.py tests/test_cloudflare_b1.py

      - name: Bind exact live PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in (*[!0-9]*|'') echo 'invalid PR number' >&2; exit 2;; esac
          case "$CANDIDATE_SHA" in (*[!0-9a-f]*|'') echo 'invalid candidate SHA' >&2; exit 2;; esac
          [ "${#CANDIDATE_SHA}" -eq 40 ] || { echo 'candidate SHA must be 40 hex' >&2; exit 2; }
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          [ "$live_head" = "$CANDIDATE_SHA" ] || { echo "exact-head mismatch: $live_head" >&2; exit 2; }
          checked_out="$(git rev-parse HEAD)"
          [ "$checked_out" = "$CANDIDATE_SHA" ] || { echo "checkout mismatch: $checked_out" >&2; exit 2; }

      - name: Build bounded Codex request
        run: |
          set -euo pipefail
          cat > /tmp/criteria.json <<'JSON'
          [
            "Review is read-only and remains bound to the exact current PR head",
            "Report concrete code defects as review findings rather than modifying the candidate",
            "If evidence is genuinely missing or conflicting, tag the finding CONTROL_B1_INDETERMINATE:",
            "Do not infer merge, release, deployment, queue, claim or canonical result authority"
          ]
          JSON
          python scripts/codex_b1_canary.py request \
            --task-id "$TASK_ID" \
            --handover-id "$HANDOVER_ID" \
            --candidate-sha "$CANDIDATE_SHA" \
            --criteria /tmp/criteria.json \
            --output /tmp/codex-request.md

      - name: Request native Codex review
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --raw-field body="$(cat /tmp/codex-request.md)")"
          comment_id="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"
          echo "CODEX_B1_HANDSHAKE_REQUESTED=true"
          echo "semantic_authority=false"

      - name: Observe Codex completion
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ steps.request.outputs.comment_id }}
        run: |
          set -euo pipefail
          status=PENDING
          verdict=''
          for _ in $(seq 1 40); do
            gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" > /tmp/reactions.json
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" > /tmp/reviews.json
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100" > /tmp/review-comments.json
            printf '[]\n' > /tmp/issue-comments.json
            python scripts/codex_b1_canary.py classify \
              --candidate-sha "$CANDIDATE_SHA" \
              --reviews /tmp/reviews.json \
              --review-comments /tmp/review-comments.json \
              --reactions /tmp/reactions.json \
              --issue-comments /tmp/issue-comments.json \
              --output /tmp/codex-result.json
            status="$(python -c 'import json; print(json.load(open("/tmp/codex-result.json"))["status"])')"
            verdict="$(python -c 'import json; print(json.load(open("/tmp/codex-result.json"))["verdict"] or "")')"
            if [ "$status" != PENDING ]; then break; fi
            sleep 30
          done
          cat /tmp/codex-result.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          [ "$status" = COMPLETE ] || { echo "Codex handshake did not complete cleanly: $status" >&2; exit 2; }

      - name: Publish non-authoritative handshake status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.observe.outputs.status }}
          VERDICT: ${{ steps.observe.outputs.verdict }}
        run: |
          set -euo pipefail
          state=failure
          description="CODEX_B1_HANDSHAKE_${STATUS:-UNKNOWN}_${VERDICT:-NONE}"
          if [ "${STATUS:-}" = COMPLETE ]; then state=success; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="control/codex-b1-handshake" \
            -f description="${description:0:140}" >/dev/null
          printf 'semantic_authority=false\nverdict=%s\n' "${VERDICT:-NONE}"
