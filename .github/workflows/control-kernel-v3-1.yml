name: Control Kernel V3.1

on:
  schedule:
    - cron: '*/15 * * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: TICK, CLAIM, RECORD or RELEASE
        required: true
        type: choice
        options: [TICK, CLAIM, RECORD, RELEASE]
      task_id:
        description: AUTO or exact canonical task id
        required: false
        default: AUTO
        type: string
      run_id:
        description: Exact current run id for RECORD/RELEASE
        required: false
        type: string
      result_payload:
        description: Bounded JSON semantic result for RECORD
        required: false
        type: string
      release_reason:
        description: EXECUTION_UNAVAILABLE or EXECUTION_ABORTED
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: control-runtime-mutation
  cancel-in-progress: false

env:
  CONTROL_PLANE_REPOSITORY: market-predictions/control-plane

jobs:
  kernel:
    if: >-
      github.repository == 'market-predictions/control-engine' &&
      (
        (github.event_name != 'issue_comment' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 100 &&
          github.event.comment.user.login == vars.CONTROL_A1_GITHUB_ACTOR &&
          startsWith(github.event.comment.body, 'CONTROL_V3_1_A1_COMMAND_V1')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact public Control kernel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate kernel syntax
        run: >-
          python -m py_compile
          control_engine/kernel_v31.py
          control_engine/ingress_v31.py
          control_engine/codex_v31.py
          scripts/control_kernel_v31.py
          scripts/control_codex_v31.py

      - name: Parse authenticated A1 transport command
        id: a1-command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from control_engine.ingress_v31 import parse_a1_command

          command = parse_a1_command(os.environ['COMMENT_BODY'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"command={command.command}\n")
              handle.write(f"task_id={command.task_id}\n")
              handle.write(f"run_id={command.run_id or ''}\n")
              handle.write(f"reason={command.reason or ''}\n")
              payload = '' if command.result is None else json.dumps(command.result, separators=(',', ':'), sort_keys=True)
              handle.write(f"result_payload={payload}\n")
          PY

      - name: Preflight GitHub App
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create exact private-runtime capability
        id: runtime-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: market-predictions
          repositories: control-plane
          permission-contents: write

      - name: Validate canonical private runtime authority
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          headers = {
              'Authorization': f"Bearer {os.environ['CONTROL_RUNTIME_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'control-kernel-v3-1',
          }

          def get(path):
              req = urllib.request.Request(f'https://api.github.com/{path}', headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          repository = get('repos/market-predictions/control-plane')
          if repository.get('full_name') != 'market-predictions/control-plane' or repository.get('private') is not True:
              raise SystemExit('CONTROL_RUNTIME_AUTHORITY=FAIL_CLOSED_REPOSITORY')

          branch = get('repos/market-predictions/control-plane/branches/control-runtime-state')
          sha = branch.get('commit', {}).get('sha')
          if (
              branch.get('name') != 'control-runtime-state'
              or not isinstance(sha, str)
              or re.fullmatch(r'[0-9a-f]{40}', sha) is None
          ):
              raise SystemExit('CONTROL_RUNTIME_AUTHORITY=FAIL_CLOSED_BRANCH')

          print('CONTROL_RUNTIME_AUTHORITY=PRIVATE_CANONICAL_BRANCH')
          print(f'CONTROL_RUNTIME_HEAD={sha}')
          PY

      - name: Resolve authenticated semantic role
        id: semantic-role
        if: github.event_name == 'workflow_dispatch' && inputs.command != 'TICK'
        shell: bash
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          A1_ACTOR: ${{ vars.CONTROL_A1_GITHUB_ACTOR }}
          B1_ACTOR: ${{ vars.CONTROL_B1_GITHUB_ACTOR }}
        run: |
          set -euo pipefail
          [ -n "$TRIGGERING_ACTOR" ]
          [ -n "$A1_ACTOR" ] && [ -n "$B1_ACTOR" ]
          [ "$A1_ACTOR" != "$B1_ACTOR" ]
          case "$TRIGGERING_ACTOR" in
            "$A1_ACTOR")
              echo 'role=implementation_operations' >> "$GITHUB_OUTPUT"
              echo 'worker=A1' >> "$GITHUB_OUTPUT"
              ;;
            "$B1_ACTOR")
              echo 'role=governance_release_assurance' >> "$GITHUB_OUTPUT"
              echo 'worker=B1' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo '::error::Authenticated triggering actor has no V3.1 semantic role capability.'
              exit 1
              ;;
          esac

      - name: Plan exact target-repository capability
        id: plan
        if: >-
          github.event_name == 'schedule' ||
          inputs.command == 'TICK' ||
          (github.event_name == 'issue_comment' && steps.a1-command.outputs.command == 'CODEX_START')
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
          A1_COMMAND: ${{ steps.a1-command.outputs.command }}
          A1_TASK_ID: ${{ steps.a1-command.outputs.task_id }}
        run: |
          set -euo pipefail
          kind=''
          task_id=''
          target=''

          if [ "$A1_COMMAND" = 'CODEX_START' ]; then
            output="$(python scripts/control_codex_v31.py plan-start --task-id "$A1_TASK_ID")"
            kind='CODEX_START'
            task_id="$(printf '%s\n' "$output" | sed -n 's/^CONTROL_CODEX_TASK_ID=//p' | tail -n1)"
            target="$(printf '%s\n' "$output" | sed -n 's/^CONTROL_CODEX_TARGET_REPOSITORY=//p' | tail -n1)"
          else
            codex="$(python scripts/control_codex_v31.py plan-active)"
            task_id="$(printf '%s\n' "$codex" | sed -n 's/^CONTROL_CODEX_TASK_ID=//p' | tail -n1)"
            target="$(printf '%s\n' "$codex" | sed -n 's/^CONTROL_CODEX_TARGET_REPOSITORY=//p' | tail -n1)"
            if [ -n "$target" ]; then
              kind='CODEX_ACTIVE'
            else
              output="$(python scripts/control_kernel_v31.py plan-tick)"
              task_id="$(printf '%s\n' "$output" | sed -n 's/^CONTROL_KERNEL_TARGET_TASK_ID=//p' | tail -n1)"
              target="$(printf '%s\n' "$output" | sed -n 's/^CONTROL_KERNEL_TARGET_REPOSITORY=//p' | tail -n1)"
              if [ -n "$target" ]; then
                kind='TICK_TARGET'
              fi
            fi
          fi

          if [ -n "$target" ]; then
            [ -n "$task_id" ]
            owner="${target%%/*}"
            repo="${target#*/}"
            [ "$owner" != "$target" ] && [ -n "$repo" ]
          else
            [ -z "$task_id" ]
            owner=''
            repo=''
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Create exact target-repository capability
        id: target-token
        if: steps.plan.outputs.target != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.plan.outputs.owner }}
          repositories: ${{ steps.plan.outputs.repo }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: read
          permission-checks: read
          permission-statuses: write

      - name: Reconcile active native Codex B1 evidence
        if: steps.plan.outputs.kind == 'CODEX_ACTIVE'
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
          CONTROL_TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          TASK_ID: ${{ steps.plan.outputs.task_id }}
        run: |
          set -euo pipefail
          python scripts/control_codex_v31.py reconcile --task-id "$TASK_ID"

      - name: Execute deterministic TICK
        if: github.event_name == 'schedule' || inputs.command == 'TICK'
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
          CONTROL_TARGET_TOKEN: ${{ steps.plan.outputs.kind == 'TICK_TARGET' && steps.target-token.outputs.token || '' }}
          CONTROL_TARGET_TASK_ID: ${{ steps.plan.outputs.kind == 'TICK_TARGET' && steps.plan.outputs.task_id || '' }}
          CONTROL_TARGET_REPOSITORY: ${{ steps.plan.outputs.kind == 'TICK_TARGET' && steps.plan.outputs.target || '' }}
        run: |
          set -euo pipefail
          python scripts/control_kernel_v31.py tick

      - name: Execute authenticated CLAIM
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'CLAIM'
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
          ROLE: ${{ steps.semantic-role.outputs.role }}
          WORKER: ${{ steps.semantic-role.outputs.worker }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          python scripts/control_kernel_v31.py claim --role "$ROLE" --worker "$WORKER" --task-id "${TASK_ID:-AUTO}"

      - name: Execute authenticated atomic RECORD
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'RECORD'
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
          ROLE: ${{ steps.semantic-role.outputs.role }}
          WORKER: ${{ steps.semantic-role.outputs.worker }}
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ inputs.run_id }}
          CONTROL_RESULT_PAYLOAD: ${{ inputs.result_payload }}
        run: |
          set -euo pipefail
          [ -n "$TASK_ID" ] && [ -n "$RUN_ID" ] && [ -n "$CONTROL_RESULT_PAYLOAD" ]
          python scripts/control_kernel_v31.py record --role "$ROLE" --worker "$WORKER" --task-id "$TASK_ID" --run-id "$RUN_ID"

      - name: Execute authenticated RELEASE
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'RELEASE'
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
          ROLE: ${{ steps.semantic-role.outputs.role }}
          WORKER: ${{ steps.semantic-role.outputs.worker }}
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_REASON: ${{ inputs.release_reason }}
        run: |
          set -euo pipefail
          [ -n "$TASK_ID" ] && [ -n "$RUN_ID" ]
          case "$RELEASE_REASON" in EXECUTION_UNAVAILABLE|EXECUTION_ABORTED) ;; *) exit 2 ;; esac
          python scripts/control_kernel_v31.py release --role "$ROLE" --worker "$WORKER" --task-id "$TASK_ID" --run-id "$RUN_ID" --reason "$RELEASE_REASON"

      - name: Execute A1 transport CLAIM
        if: github.event_name == 'issue_comment' && steps.a1-command.outputs.command == 'CLAIM'
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
          TASK_ID: ${{ steps.a1-command.outputs.task_id }}
        run: |
          set -euo pipefail
          python scripts/control_kernel_v31.py claim --role implementation_operations --worker A1 --task-id "$TASK_ID"

      - name: Execute A1 transport atomic RECORD
        if: github.event_name == 'issue_comment' && steps.a1-command.outputs.command == 'RECORD'
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
          TASK_ID: ${{ steps.a1-command.outputs.task_id }}
          RUN_ID: ${{ steps.a1-command.outputs.run_id }}
          CONTROL_RESULT_PAYLOAD: ${{ steps.a1-command.outputs.result_payload }}
        run: |
          set -euo pipefail
          python scripts/control_kernel_v31.py record --role implementation_operations --worker A1 --task-id "$TASK_ID" --run-id "$RUN_ID"

      - name: Execute A1 transport RELEASE
        if: github.event_name == 'issue_comment' && steps.a1-command.outputs.command == 'RELEASE'
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
          TASK_ID: ${{ steps.a1-command.outputs.task_id }}
          RUN_ID: ${{ steps.a1-command.outputs.run_id }}
          RELEASE_REASON: ${{ steps.a1-command.outputs.reason }}
        run: |
          set -euo pipefail
          python scripts/control_kernel_v31.py release --role implementation_operations --worker A1 --task-id "$TASK_ID" --run-id "$RUN_ID" --reason "$RELEASE_REASON"

      - name: Start kernel-owned native Codex B1 run
        if: github.event_name == 'issue_comment' && steps.a1-command.outputs.command == 'CODEX_START'
        shell: bash
        env:
          CONTROL_RUNTIME_TOKEN: ${{ steps.runtime-token.outputs.token }}
          CONTROL_TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          TASK_ID: ${{ steps.a1-command.outputs.task_id }}
        run: |
          set -euo pipefail
          python scripts/control_codex_v31.py start --task-id "$TASK_ID"

      - name: Prove kernel boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'CONTROL_AUTONOMY_V3_1=true'
          echo 'CONTROL_RUNTIME_WRITER=CONTROL_KERNEL'
          echo 'CONTROL_RUNTIME_PROTECTION_REQUIRED=false'
          echo 'CONTROL_RUNTIME_WRITE_GUARD=CAS_SCOPE_VALIDATION'
          echo 'CONTROL_A1_COMMENT=TRANSPORT_ONLY'
          echo 'CONTROL_B1_SEMANTIC_EXECUTOR=TRUSTED_CODEX_GITHUB_REVIEW'
          echo 'CONTROL_A1_SUPPLIED_B1_VERDICT=false'
          echo 'CONTROL_SEMANTIC_INFERENCE=false'
          echo 'CONTROL_A2=false'
          echo 'CONTROL_PROVIDER_FALLBACK=false'
          echo 'CONTROL_PROJECT_INTEGRATION_SEMANTIC_TASK=false'
