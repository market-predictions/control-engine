name: Control B1 Live Trigger V1

on:
  push:
    branches:
      - control/199-g8-h13-b1-lifecycle-actuator-v1
    paths:
      - .github/workflows/control-b1-live-trigger-v1.yml

permissions:
  contents: read

concurrency:
  group: control-b1-live-trigger-v1
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout actuator branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight GitHub App
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create actions-write token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: control-engine
          permission-actions: write
          permission-contents: read

      - name: Trigger existing production canonical B1
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api -X POST \
            'repos/market-predictions/control-engine/actions/workflows/canonical-b1-dual-executor-v1.yml/dispatches' \
            -f ref=main
          echo 'CONTROL_B1_LIVE_TRIGGER=DISPATCHED'
