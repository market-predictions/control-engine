name: Cloudflare Assurance Preflight V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloudflare-assurance-preflight-v1.yml'

permissions:
  contents: read
  statuses: write

jobs:
  cloudflare-assurance-preflight:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact public probe code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight GitHub App identity and installation
        id: app-preflight
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived read token for private Control code
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'read'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Probe current and fallback Cloudflare assurance models without queue state
        id: probe
        continue-on-error: true
        shell: bash
        env:
          CONTROL_GITHUB_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CONTROL_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CONTROL_CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_CLOUDFLARE_FREE_FAIL_CLOSED_ATTESTED: ${{ vars.CONTROL_CLOUDFLARE_FREE_FAIL_CLOSED_ATTESTED }}
        run: |
          set -euo pipefail
          CODE_REF='recovery/intake-immutable-result-collision-r1'
          CODE_SHA='7e0e9e218467c3090dbfcbb63a51a819cc19aba6'
          ROOT="${RUNNER_TEMP}/cloudflare-assurance-preflight"
          CODE_DIR="${ROOT}/code"
          mkdir -p "$CODE_DIR"
          trap 'rm -rf "$ROOT"' EXIT

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CONTROL_GITHUB_READ_TOKEN" | base64 -w0)"
          git -C "$CODE_DIR" init -q
          git -C "$CODE_DIR" remote add origin 'https://github.com/market-predictions/control-plane.git'
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" -C "$CODE_DIR" fetch --quiet --depth=1 origin "refs/heads/${CODE_REF}"
          git -C "$CODE_DIR" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$CODE_DIR" rev-parse HEAD)" = "$CODE_SHA"

          run_probe() {
            local key="$1"
            local model="$2"
            local policy="$ROOT/policy-${key}.md"
            local result="$ROOT/result-${key}.json"
            local metadata="$ROOT/metadata-${key}.json"
            local log="$ROOT/probe-${key}.log"
            local attempt="cf-assurance-preflight-${key}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            python - "$CODE_DIR/control/INFERENCE_PROVIDER_POLICY_V1.md" "$policy" "$model" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text(encoding='utf-8')
          target = Path(sys.argv[2])
          model = sys.argv[3]
          old = 'candidate_model=@cf/openai/gpt-oss-120b'
          if source.count(old) != 1:
              raise SystemExit('expected exactly one Cloudflare assurance model machine fact')
          target.write_text(source.replace(old, f'candidate_model={model}'), encoding='utf-8')
          PY

            set +e
            python "$CODE_DIR/dispatcher/inference_worker.py" \
              --provider-policy "$policy" \
              --role assurance \
              --attempt-id "$attempt" \
              --preflight-only \
              --output-file "$result" \
              --metadata-file "$metadata" \
              >"$log" 2>&1
            local rc=$?
            set -e

            python - "$metadata" "$key" "$rc" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          key = sys.argv[2]
          rc = int(sys.argv[3])
          output = Path(sys.argv[4])
          meta = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          allowed = {
              'provider_id', 'model_id', 'billing_class', 'endpoint_class',
              'structured_final_mode', 'error_code', 'http_status',
              'provider_switches', 'secret_values_exposed'
          }
          safe = {k: meta.get(k) for k in sorted(allowed) if k in meta}
          lines = [
              f'{key}_rc={rc}',
              f'{key}_error_code={meta.get("error_code") or "NONE"}',
              f'{key}_http_status={meta.get("http_status") if meta.get("http_status") is not None else "NONE"}',
              f'{key}_safe_metadata=' + json.dumps(safe, separators=(',', ':')),
          ]
          with output.open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY
            return "$rc"
          }

          any_pass=false

          if run_probe gpt_oss '@cf/openai/gpt-oss-120b'; then
            any_pass=true
          else
            if run_probe nemotron '@cf/nvidia/nemotron-3-120b-a12b'; then
              any_pass=true
            else
              if run_probe qwen38 '@cf/qwen/qwen3.8-27b'; then
                any_pass=true
              fi
            fi
          fi

          printf 'any_pass=%s\n' "$any_pass" >> "$GITHUB_OUTPUT"
          test "$any_pass" = true

      - name: Publish sanitized Cloudflare capability statuses
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANY_PASS: ${{ steps.probe.outputs.any_pass }}
          GPT_OSS_RC: ${{ steps.probe.outputs.gpt_oss_rc }}
          GPT_OSS_ERROR: ${{ steps.probe.outputs.gpt_oss_error_code }}
          GPT_OSS_HTTP: ${{ steps.probe.outputs.gpt_oss_http_status }}
          NEMOTRON_RC: ${{ steps.probe.outputs.nemotron_rc }}
          NEMOTRON_ERROR: ${{ steps.probe.outputs.nemotron_error_code }}
          NEMOTRON_HTTP: ${{ steps.probe.outputs.nemotron_http_status }}
          QWEN38_RC: ${{ steps.probe.outputs.qwen38_rc }}
          QWEN38_ERROR: ${{ steps.probe.outputs.qwen38_error_code }}
          QWEN38_HTTP: ${{ steps.probe.outputs.qwen38_http_status }}
        run: |
          set -euo pipefail
          publish_one() {
            local key="$1" rc="$2" code="$3" http="$4"
            [ -n "$rc" ] || return 0
            if [ "$rc" = '0' ]; then
              state=success
              description="CF_${key}_PREFLIGHT_PASS"
            else
              state=failure
              description="CF_${key}_${code:-UNKNOWN}_HTTP_${http:-NONE}"
            fi
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" \
              -f context="control/cf-preflight/${description}" \
              -f description="$description" >/dev/null
          }

          publish_one GPT_OSS "$GPT_OSS_RC" "$GPT_OSS_ERROR" "$GPT_OSS_HTTP"
          publish_one NEMOTRON "$NEMOTRON_RC" "$NEMOTRON_ERROR" "$NEMOTRON_HTTP"
          publish_one QWEN38 "$QWEN38_RC" "$QWEN38_ERROR" "$QWEN38_HTTP"

          if [ "$ANY_PASS" = 'true' ]; then
            overall=success
            description=CF_ASSURANCE_CAPACITY_AVAILABLE
          else
            overall=failure
            description=CF_ASSURANCE_CAPACITY_UNAVAILABLE
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$overall" \
            -f context="control/cf-preflight/overall" \
            -f description="$description" >/dev/null
          test "$overall" = success
