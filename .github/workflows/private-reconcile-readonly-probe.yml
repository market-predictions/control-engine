name: Private A Reconcile Readonly Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/private-reconcile-readonly-probe.yml'
      - 'scripts/private_reconcile_readonly_probe.py'
      - 'scripts/project_integration_executor.py'
      - 'control_engine/scheduled_worker_a.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact public diagnostic code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Create short-lived Control GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'read'
          permission-issues: 'write'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate probe syntax
        run: python -m py_compile scripts/private_reconcile_readonly_probe.py

      - name: Run read-only private reconciliation probe
        env:
          CONTROL_GITHUB_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/private_reconcile_readonly_probe.py
