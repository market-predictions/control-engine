name: Gate-8 R16 Deterministic Apply V1

on:
  push:
    branches:
      - control/199-g8-h11-b1-lifecycle-actuator-v1
    paths:
      - .control/g8-r16-apply-command.json
      - .github/workflows/g8-r16-deterministic-apply-v1.yml

permissions:
  contents: read

concurrency:
  group: control-199-g8-r16-deterministic-apply-v1
  cancel-in-progress: false

env:
  CONTROL_PLANE_REPOSITORY: market-predictions/control-plane
  CONTROL_RUNTIME_REF: control-runtime-state
  CONTROL_TASK_ID: CONTROL-199-G8-PR70-FINAL-VALIDATION-BOUNDARY-REPAIR-R16
  CONTROL_CANDIDATE_BRANCH: control/199-g8-b1-profile-activation-v1
  CONTROL_EXPECTED_HEAD: d132eb1436ebc33d9ff18327644997b6883d155a

jobs:
  apply:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/control/199-g8-h11-b1-lifecycle-actuator-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact command
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.version=="1.0" and .action=="apply" and .task_id==env.CONTROL_TASK_ID and .expected_head==env.CONTROL_EXPECTED_HEAD and (.nonce|type=="string") and (.nonce|length>0) and (keys|sort)==(["action","expected_head","nonce","task_id","version"]|sort)' .control/g8-r16-apply-command.json >/dev/null

      - name: Preflight GitHub App
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'write'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reprove current R16 claim and exact candidate
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CONTROL_TOKEN"
          private_url="https://x-access-token:${CONTROL_TOKEN}@github.com/${CONTROL_PLANE_REPOSITORY}.git"
          state="$RUNNER_TEMP/state"
          git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$private_url" "$state"
          python - "$state/control/DISPATCH_QUEUE.json" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          q=json.load(open(sys.argv[1], encoding='utf-8'))
          rows=[x for x in q['tasks'] if x.get('task_id')==os.environ['CONTROL_TASK_ID']]
          if len(rows)!=1: raise SystemExit('R16 task identity mismatch')
          t=rows[0]
          if t.get('state')!='REPAIR_EXECUTING' or t.get('active_role')!='implementation_operations' or t.get('active_worker_instance')!='A1': raise SystemExit('R16 START_PROVEN missing')
          if t.get('candidate_sha')!=os.environ['CONTROL_EXPECTED_HEAD']: raise SystemExit('R16 candidate mismatch')
          exp=datetime.fromisoformat(t['claim_expires_at'].replace('Z','+00:00'))
          if exp <= datetime.now(timezone.utc): raise SystemExit('R16 claim expired')
          if q.get('principal_manual_relay_count')!=0 or t.get('principal_manual_relay_count')!=0: raise SystemExit('relay invariant changed')
          print('R16_START_PROVEN=' + t['active_run_id'])
          PY
          target="$RUNNER_TEMP/target"
          git clone --quiet --single-branch --branch "$CONTROL_CANDIDATE_BRANCH" "https://x-access-token:${CONTROL_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
          [ "$(git -C "$target" rev-parse HEAD)" = "$CONTROL_EXPECTED_HEAD" ]
          echo "TARGET=$target" >> "$GITHUB_ENV"

      - name: Apply only R16 bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python - "$TARGET" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          script=root/'scripts/canonical_b1_dual_executor_v1.py'
          workflow=root/'.github/workflows/canonical-b1-dual-executor-v1.yml'
          tests=root/'tests/test_canonical_b1_dual_executor_v1.py'

          s=script.read_text(encoding='utf-8')
          old='''    for item in reviews:\n        if _record_login(item) not in TRUSTED_CODEX_LOGINS:\n            continue\n        event_time = _record_event_time(item)\n        if event_time < request_start:\n            continue\n        if not _positive_int(item.get("id")) or not isinstance(item.get("state"), str) or not item.get("state"):\n            raise CanonicalB1Error("trusted DEEP review malformed")\n        _validate_commit_binding(item, "DEEP review")\n\n    for item in review_comments:\n        if _record_login(item) not in TRUSTED_CODEX_LOGINS:\n            continue\n        event_time = _record_event_time(item)\n        if event_time < request_start:\n            continue\n        if (\n            not _positive_int(item.get("id"))\n            or not _positive_int(item.get("pull_request_review_id"))\n            or not isinstance(item.get("body"), str)\n        ):\n            raise CanonicalB1Error("trusted DEEP review comment malformed")\n        _validate_commit_binding(item, "DEEP review comment")\n'''
          new='''    trusted_review_ids: set[int] = set()\n    for item in reviews:\n        if _record_login(item) not in TRUSTED_CODEX_LOGINS:\n            continue\n        event_time = _record_event_time(item)\n        if event_time < request_start:\n            continue\n        if not _positive_int(item.get("id")) or not isinstance(item.get("state"), str) or not item.get("state"):\n            raise CanonicalB1Error("trusted DEEP review malformed")\n        _validate_commit_binding(item, "DEEP review")\n        trusted_review_ids.add(item["id"])\n\n    for item in review_comments:\n        if _record_login(item) not in TRUSTED_CODEX_LOGINS:\n            continue\n        event_time = _record_event_time(item)\n        if event_time < request_start:\n            continue\n        if (\n            not _positive_int(item.get("id"))\n            or not _positive_int(item.get("pull_request_review_id"))\n            or not isinstance(item.get("body"), str)\n            or not item.get("body", "").strip()\n        ):\n            raise CanonicalB1Error("trusted DEEP review comment malformed")\n        if item["pull_request_review_id"] not in trusted_review_ids:\n            raise CanonicalB1Error("trusted DEEP review comment linkage invalid")\n        _validate_commit_binding(item, "DEEP review comment")\n'''
          if s.count(old)!=1: raise SystemExit('script validator anchor mismatch')
          script.write_text(s.replace(old,new), encoding='utf-8')

          w=workflow.read_text(encoding='utf-8')
          replacements={
            'CONTROL_PRIVATE_B_CODE_REF: runtime/public-b-v2-code-r2':'CONTROL_PRIVATE_B_CODE_REF: runtime/public-b-v2-code-r3',
            'CONTROL_PRIVATE_B_CODE_SHA: 97ef7de0007b4886e336182c7a9a0ee20ae77455':'CONTROL_PRIVATE_B_CODE_SHA: 01b3fb7e5905e61a8a96c2665d2d8afd74b4dd60',
          }
          for a,b in replacements.items():
            if w.count(a)!=1: raise SystemExit(f'workflow anchor mismatch: {a}')
            w=w.replace(a,b)
          old_claim='''          assert_active_profile "$state"\n          GH_TOKEN="$CONTROL_TOKEN" PYTHONPATH="$b_code" python "$b_code/tools/control_connected_worker_runtime_v1.py" claim \\\n            --runtime-root "$state" --runtime-ref "$CONTROL_RUNTIME_REF" --task-id "$task_id" \\\n            --worker-instance B1 --backend github-actions/canonical-b1-dual-executor-v1 --lease-seconds 900 > "$RUNNER_TEMP/claim.json"\n'''
          new_claim='''          assurance_class="$(jq -r --arg task "$task_id" '.tasks[] | select(.task_id==$task) | if ((.instruction // "") | contains("CONTROL_ASSURANCE_CLASS=DEEP")) then "DEEP" else "STANDARD" end' "$state/control/DISPATCH_QUEUE.json")"\n          lease_seconds=900\n          if [ "$assurance_class" = DEEP ]; then lease_seconds=5400; fi\n          designated_ci_run_id="$(python - "$state/control/DISPATCH_QUEUE.json" "$task_id" <<'PYCI'\n          import json, re, sys\n          q=json.load(open(sys.argv[1], encoding='utf-8')); task_id=sys.argv[2]\n          rows=[x for x in q['tasks'] if x.get('task_id')==task_id]\n          if len(rows)!=1: raise SystemExit('designated CI task identity mismatch')\n          t=rows[0]; texts=[t.get('instruction',''), *t.get('acceptance_criteria',[])]\n          ids=set()\n          for text in texts:\n              if isinstance(text,str): ids.update(re.findall(r'\\bCI run[ _-]*(\\d+)\\b', text, flags=re.I))\n          if len(ids)!=1: raise SystemExit('exactly one designated CI run identity is required')\n          print(next(iter(ids)))\n          PYCI\n          )"\n          [[ "$designated_ci_run_id" =~ ^[0-9]+$ ]]\n\n          assert_active_profile "$state"\n          GH_TOKEN="$CONTROL_TOKEN" PYTHONPATH="$b_code" python "$b_code/tools/control_connected_worker_runtime_v1.py" claim \\\n            --runtime-root "$state" --runtime-ref "$CONTROL_RUNTIME_REF" --task-id "$task_id" \\\n            --worker-instance B1 --backend github-actions/canonical-b1-dual-executor-v1 --lease-seconds "$lease_seconds" > "$RUNNER_TEMP/claim.json"\n'''
          if w.count(old_claim)!=1: raise SystemExit('claim anchor mismatch')
          w=w.replace(old_claim,new_claim)
          out_anchor='''          printf 'run_id=%s\\n' "$run_id" >> "$GITHUB_OUTPUT"\n'''
          out_new=out_anchor+'''          printf 'designated_ci_run_id=%s\\n' "$designated_ci_run_id" >> "$GITHUB_OUTPUT"\n          printf 'assurance_class=%s\\n' "$assurance_class" >> "$GITHUB_OUTPUT"\n'''
          if w.count(out_anchor)!=1: raise SystemExit('claim output anchor mismatch')
          w=w.replace(out_anchor,out_new)
          env_anchor='''          ACTIVE_RUN_ID: ${{ steps.claim.outputs.run_id }}\n          PYTHONPATH: .\n'''
          env_new='''          ACTIVE_RUN_ID: ${{ steps.claim.outputs.run_id }}\n          DESIGNATED_CI_RUN_ID: ${{ steps.claim.outputs.designated_ci_run_id }}\n          PYTHONPATH: .\n'''
          if w.count(env_anchor)!=1: raise SystemExit('evidence env anchor mismatch')
          w=w.replace(env_anchor,env_new)
          old_ci='''          ci_run_id="$(\n            jq -r --arg sha "$TARGET_CANDIDATE_SHA" --argjson workflow_id "$CONTROL_CI_WORKFLOW_ID" '\n              [.workflow_runs[] |\n                select(\n                  .workflow_id == $workflow_id and\n                  .head_sha == $sha and\n                  .status == "completed" and\n                  .conclusion == "success"\n                )\n              ] | sort_by(.id) | last | .id // empty\n            ' "$RUNNER_TEMP/workflow-runs.json"\n          )"\n          [[ "$ci_run_id" =~ ^[0-9]+$ ]]\n'''
          new_ci='''          ci_run_id="$DESIGNATED_CI_RUN_ID"\n          [[ "$ci_run_id" =~ ^[0-9]+$ ]]\n'''
          if w.count(old_ci)!=1: raise SystemExit('dynamic CI selection anchor mismatch')
          w=w.replace(old_ci,new_ci)
          workflow.write_text(w, encoding='utf-8')

          t=tests.read_text(encoding='utf-8')
          old_sha='CONTROL_PRIVATE_B_CODE_SHA: 97ef7de0007b4886e336182c7a9a0ee20ae77455'
          if t.count(old_sha)!=1: raise SystemExit('test SHA anchor mismatch')
          t=t.replace(old_sha,'CONTROL_PRIVATE_B_CODE_SHA: 01b3fb7e5905e61a8a96c2665d2d8afd74b4dd60')
          addition=r'''\n\ndef _valid_deep_records(*, comment_body="P1 BLOCKER", review_id=777, linked_review_id=777):\n    request_start = "2026-08-24T22:00:00Z"\n    return dict(\n        reviews=[{\n            "id": review_id,\n            "user": {"login": "chatgpt-codex-connector"},\n            "state": "COMMENTED",\n            "submitted_at": "2026-08-24T22:00:10Z",\n            "commit_id": CANDIDATE,\n        }],\n        review_comments=[{\n            "id": 888,\n            "user": {"login": "chatgpt-codex-connector"},\n            "pull_request_review_id": linked_review_id,\n            "commit_id": CANDIDATE,\n            "body": comment_body,\n            "created_at": "2026-08-24T22:00:11Z",\n        }],\n        reactions=[],\n        issue_comments=[{\n            "id": 321,\n            "user": {"login": "market-predictions"},\n            "body": "request",\n            "created_at": request_start,\n            "updated_at": request_start,\n        }],\n        request_comment_id=321,\n        trusted_actuator_login="market-predictions",\n    )\n\n\ndef test_trusted_review_comment_empty_body_fails_closed():\n    with pytest.raises(mod.CanonicalB1Error, match="review comment malformed"):\n        mod._validate_deep_snapshot_records(**_valid_deep_records(comment_body="   "))\n\n\ndef test_trusted_review_comment_requires_fetched_trusted_review_linkage():\n    with pytest.raises(mod.CanonicalB1Error, match="review comment linkage"):\n        mod._validate_deep_snapshot_records(**_valid_deep_records(linked_review_id=999))\n\n\ndef test_trusted_review_comment_valid_linkage_remains_accepted():\n    mod._validate_deep_snapshot_records(**_valid_deep_records())\n\n\ndef test_workflow_uses_bounded_deep_lease_and_exact_designated_ci_run():\n    text = WORKFLOW.read_text(encoding="utf-8")\n    assert "CONTROL_PRIVATE_B_CODE_REF: runtime/public-b-v2-code-r3" in text\n    assert "CONTROL_PRIVATE_B_CODE_SHA: 01b3fb7e5905e61a8a96c2665d2d8afd74b4dd60" in text\n    assert "lease_seconds=900" in text\n    assert 'if [ "$assurance_class" = DEEP ]; then lease_seconds=5400; fi' in text\n    assert '--lease-seconds "$lease_seconds"' in text\n    assert 'DESIGNATED_CI_RUN_ID: ${{ steps.claim.outputs.designated_ci_run_id }}' in text\n    assert 'ci_run_id="$DESIGNATED_CI_RUN_ID"' in text\n    assert "sort_by(.id) | last" not in text\n    assert "exactly one designated CI run identity is required" in text\n'''
          if 'test_workflow_uses_bounded_deep_lease_and_exact_designated_ci_run' in t: raise SystemExit('R16 tests already present')
          tests.write_text(t + addition, encoding='utf-8')
          PY
          python -m py_compile "$TARGET/scripts/canonical_b1_dual_executor_v1.py"
          python -m pytest -q "$TARGET/tests/test_canonical_b1_dual_executor_v1.py"

      - name: Reprove R16 claim and publish exact three-file candidate
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/state-final"
          private_url="https://x-access-token:${CONTROL_TOKEN}@github.com/${CONTROL_PLANE_REPOSITORY}.git"
          git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$private_url" "$state"
          python - "$state/control/DISPATCH_QUEUE.json" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          q=json.load(open(sys.argv[1], encoding='utf-8')); rows=[x for x in q['tasks'] if x.get('task_id')==os.environ['CONTROL_TASK_ID']]
          if len(rows)!=1: raise SystemExit('R16 task identity mismatch')
          t=rows[0]; exp=datetime.fromisoformat(t['claim_expires_at'].replace('Z','+00:00'))
          if t.get('state')!='REPAIR_EXECUTING' or t.get('active_worker_instance')!='A1' or exp<=datetime.now(timezone.utc): raise SystemExit('R16 claim no longer current')
          PY
          [ "$(git -C "$TARGET" rev-parse HEAD)" = "$CONTROL_EXPECTED_HEAD" ]
          changed="$(git -C "$TARGET" status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/canonical-b1-dual-executor-v1.yml' 'scripts/canonical_b1_dual_executor_v1.py' 'tests/test_canonical_b1_dual_executor_v1.py' | sort)"
          [ "$changed" = "$expected" ]
          git -C "$TARGET" config user.name 'control-r16-deterministic-apply[bot]'
          git -C "$TARGET" config user.email 'control-r16-deterministic-apply[bot]@users.noreply.github.com'
          git -C "$TARGET" add -- .github/workflows/canonical-b1-dual-executor-v1.yml scripts/canonical_b1_dual_executor_v1.py tests/test_canonical_b1_dual_executor_v1.py
          git -C "$TARGET" commit -m 'CONTROL #199: close final Gate-8 validation boundaries'
          git -C "$TARGET" push origin "HEAD:refs/heads/${CONTROL_CANDIDATE_BRANCH}"
          echo "R16_CANDIDATE=$(git -C "$TARGET" rev-parse HEAD)"
