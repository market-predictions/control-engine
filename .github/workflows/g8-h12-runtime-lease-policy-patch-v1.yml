name: Gate-8 H12 Runtime Lease Policy Patch V1

# One-shot deterministic patch/validation only. No semantic inference or project work.
on:
  push:
    branches:
      - control/199-g8-h12-b1-lifecycle-actuator-v1
    paths:
      - .control/g8-h12-runtime-lease-policy-patch-command.json
      - .github/workflows/g8-h12-runtime-lease-policy-patch-v1.yml

permissions:
  contents: read

concurrency:
  group: control-199-g8-h12-runtime-lease-policy-patch-v1
  cancel-in-progress: false

env:
  CONTROL_PLANE_REPOSITORY: market-predictions/control-plane
  TARGET_BRANCH: runtime/public-b-v2-code-r3
  EXPECTED_HEAD: 97ef7de0007b4886e336182c7a9a0ee20ae77455

jobs:
  patch:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/control/199-g8-h12-b1-lifecycle-actuator-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact one-shot command
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.version=="1.0" and .action=="patch_b1_deep_lease_policy" and .target_branch==env.TARGET_BRANCH and .expected_head==env.EXPECTED_HEAD and (.nonce|type=="string") and (.nonce|length>0) and (keys|sort)==(["action","expected_head","nonce","target_branch","version"]|sort)' .control/g8-h12-runtime-lease-policy-patch-command.json >/dev/null

      - name: Preflight GitHub App
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived private token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'write'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Patch exactly policy plus focused regressions
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CONTROL_TOKEN"
          private_url="https://x-access-token:${CONTROL_TOKEN}@github.com/${CONTROL_PLANE_REPOSITORY}.git"
          root="$RUNNER_TEMP/control-plane"
          git clone --quiet --single-branch --branch "$TARGET_BRANCH" "$private_url" "$root"
          [ "$(git -C "$root" rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          python - "$root" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          code=root/'tools/control_parallel_execution_v1.py'
          text=code.read_text()
          old='DEFAULT_PRIORITY = 1000\nDEFAULT_STABLE_CLAIM_LEASE_SECONDS = 900\n'
          new='DEFAULT_PRIORITY = 1000\nDEFAULT_STABLE_CLAIM_LEASE_SECONDS = 900\nMAX_B1_CLAIM_LEASE_SECONDS = 5400\n'
          if text.count(old)!=1:
              raise SystemExit('lease constant anchor mismatch')
          text=text.replace(old,new)
          old_func='''def _bounded_lease_seconds(worker_instance: str, lease_seconds: int) -> int:\n    if lease_seconds <= 0:\n        raise QueueError("lease_seconds must be positive")\n    if worker_instance == INSTANCE_B1:\n        return min(lease_seconds, DEFAULT_STABLE_CLAIM_LEASE_SECONDS)\n    return lease_seconds\n'''
          new_func='''def _bounded_lease_seconds(worker_instance: str, lease_seconds: int) -> int:\n    if lease_seconds <= 0:\n        raise QueueError("lease_seconds must be positive")\n    if worker_instance == INSTANCE_B1:\n        return min(lease_seconds, MAX_B1_CLAIM_LEASE_SECONDS)\n    return lease_seconds\n'''
          if text.count(old_func)!=1:
              raise SystemExit('bounded lease anchor mismatch')
          code.write_text(text.replace(old_func,new_func))

          tests=root/'tests/test_control_parallel_execution_v1.py'
          t=tests.read_text()
          anchor='''    def test_expiry_releases_resource_and_stale_run_cannot_complete(self):\n'''
          addition='''    def test_b1_default_lease_remains_15_minutes(self):\n        q = queue(task("B", "ASSURANCE_QUEUED", "org/b"), mode=MODE_LIVE_2A)\n        q = claim_task_for_instance(q, task_id="B", role=ROLE_B, worker_instance=INSTANCE_B1, run_id="b1", now=NOW)\n        self.assertEqual(q["tasks"][0]["claim_expires_at"], "2026-08-14T20:15:00Z")\n\n    def test_b1_explicit_deep_lease_allows_90_minutes_and_clamps_above(self):\n        q = queue(task("B", "ASSURANCE_QUEUED", "org/b"), mode=MODE_LIVE_2A)\n        q = claim_task_for_instance(q, task_id="B", role=ROLE_B, worker_instance=INSTANCE_B1, run_id="b1", now=NOW, lease_seconds=5400)\n        self.assertEqual(q["tasks"][0]["claim_expires_at"], "2026-08-14T21:30:00Z")\n        renewed = renew_claim(q, task_id="B", role=ROLE_B, worker_instance=INSTANCE_B1, run_id="b1", now=NOW + timedelta(minutes=10), lease_seconds=7200)\n        self.assertEqual(renewed["tasks"][0]["claim_expires_at"], "2026-08-14T21:40:00Z")\n\n'''
          if t.count(anchor)!=1:
              raise SystemExit('test insertion anchor mismatch')
          tests.write_text(t.replace(anchor,addition+anchor))
          PY
          changed="$(git -C "$root" diff --name-only | sort)"
          expected=$'tests/test_control_parallel_execution_v1.py\ntools/control_parallel_execution_v1.py'
          [ "$changed" = "$expected" ]
          (cd "$root" && python -m unittest discover -s tests -p 'test_control_parallel_execution_v1.py')
          git -C "$root" config user.name 'control-runtime-policy[bot]'
          git -C "$root" config user.email 'control-runtime-policy[bot]@users.noreply.github.com'
          git -C "$root" add tests/test_control_parallel_execution_v1.py tools/control_parallel_execution_v1.py
          git -C "$root" commit --quiet -m 'CONTROL #199: allow bounded 90m B1 DEEP leases'
          git -C "$root" fetch --quiet origin "refs/heads/$TARGET_BRANCH"
          [ "$(git -C "$root" rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD" ]
          git -C "$root" push --quiet origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "CONTROL_B1_LEASE_POLICY_PATCH=PASS"
          echo "CONTROL_B_CODE_SHA=$(git -C "$root" rev-parse HEAD)"
