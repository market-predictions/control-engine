name: Retired Provider B Recovery V2

# RETIRED 2026-08-24.
# CONTROL_ASSURANCE_EXECUTION_PROFILE_V1 permits exactly one logical B1 slot.
# Normal semantic execution is deterministic STANDARD (Cloudflare pinned GPT-OSS)
# or DEEP (native Codex GitHub review) through the canonical Gate-8 workflow.
# This legacy provider-portable recovery path is permanently non-executable as
# semantic assurance and may not claim/write private Control state.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement-proof:
    if: github.repository == 'market-predictions/control-engine'
    runs-on: ubuntu-latest
    steps:
      - name: Prove legacy Provider B is non-executable
        shell: bash
        run: |
          set -euo pipefail
          echo 'CONTROL_PROVIDER_B_RECOVERY_V2=RETIRED'
          echo 'LEGACY_PROVIDER_B_SEMANTIC_EXECUTION=false'
          echo 'PRIVATE_CONTROL_WRITE=false'
          echo 'PROVIDER_FALLBACK=false'
          echo 'B2_B3=false'
