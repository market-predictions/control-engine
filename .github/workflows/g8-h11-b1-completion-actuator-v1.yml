name: Gate-8 H12 B1 Completion Actuator V1

# Temporary deterministic lifecycle-only actuator for the START_PROVEN H12 claim.
# No semantic inference, repair, merge, release, or profile activation.

on:
  push:
    branches:
      - control/199-g8-h12-b1-lifecycle-actuator-v1
    paths:
      - .control/g8-h11-b1-completion-command.json
      - .github/workflows/g8-h11-b1-completion-actuator-v1.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: control-199-g8-h12-b1-completion-actuator-v1
  cancel-in-progress: false

env:
  CONTROL_PLANE_REPOSITORY: market-predictions/control-plane
  CONTROL_RUNTIME_REF: control-runtime-state
  CONTROL_B_CODE_REF: runtime/public-b-v2-code-r2
  CONTROL_B_CODE_SHA: 97ef7de0007b4886e336182c7a9a0ee20ae77455
  CONTROL_TASK_ID: CONTROL-199-G8-B1-PROFILE-ACTIVATION-ASSURE-H12
  CONTROL_CANDIDATE_SHA: d132eb1436ebc33d9ff18327644997b6883d155a
  CONTROL_DEEP_LEASE_SECONDS: '5400'

jobs:
  lifecycle:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/control/199-g8-h12-b1-lifecycle-actuator-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated lifecycle branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          f=.control/g8-h11-b1-completion-command.json
          jq -e '.version == "1.0" and (.action == "renew" or .action == "complete") and .task_id == env.CONTROL_TASK_ID and .candidate_sha == env.CONTROL_CANDIDATE_SHA and (.active_run_id|type=="string") and (.nonce|type=="string") and (.nonce|length>0)' "$f" >/dev/null
          action="$(jq -r '.action' "$f")"
          if [ "$action" = renew ]; then
            jq -e '(keys|sort)==(["action","active_run_id","candidate_sha","nonce","task_id","version"]|sort)' "$f" >/dev/null
          else
            jq -e '(.review_comment_id|type=="number") and .review_comment_id>0 and (keys|sort)==(["action","active_run_id","candidate_sha","nonce","review_comment_id","task_id","version"]|sort)' "$f" >/dev/null
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Preflight GitHub App
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived Control token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'write'
          permission-issues: 'read'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Fetch pinned B lifecycle code
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CONTROL_TOKEN"
          private_url="https://x-access-token:${CONTROL_TOKEN}@github.com/${CONTROL_PLANE_REPOSITORY}.git"
          b_code="$RUNNER_TEMP/control-b-code"
          git clone --quiet --single-branch --branch "$CONTROL_B_CODE_REF" "$private_url" "$b_code"
          [ "$(git -C "$b_code" rev-parse HEAD)" = "$CONTROL_B_CODE_SHA" ]
          echo "CONTROL_B_CODE_DIR=$b_code" >> "$GITHUB_ENV"
          echo "CONTROL_PRIVATE_URL=$private_url" >> "$GITHUB_ENV"

      - name: Renew exact H12 claim atomically
        if: steps.command.outputs.action == 'renew'
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(jq -r '.active_run_id' .control/g8-h11-b1-completion-command.json)"
          success=false
          for n in 1 2 3; do
            state="$RUNNER_TEMP/renew-$n"; rm -rf "$state"
            git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$CONTROL_PRIVATE_URL" "$state"
            git -C "$state" config user.name 'control-g8-h12-b1-lifecycle[bot]'
            git -C "$state" config user.email 'control-g8-h12-b1-lifecycle[bot]@users.noreply.github.com'
            ref="$(git -C "$state" rev-parse HEAD)"
            queue_blob="$(git -C "$state" rev-parse HEAD:control/DISPATCH_QUEUE.json)"
            PYTHONPATH="$CONTROL_B_CODE_DIR" python - "$state/control/DISPATCH_QUEUE.json" "$state/control/DISPATCH_RUNS.json" "$run_id" <<'PY'
          import json, os, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from tools.control_parallel_execution_v1 import renew_claim, validate_parallel_queue
          from tools.control_queue_v1 import ROLE_B

          queue_path=Path(sys.argv[1]); runs_path=Path(sys.argv[2]); run_id=sys.argv[3]
          queue=json.loads(queue_path.read_text()); runs=json.loads(runs_path.read_text())
          matches=[x for x in queue['tasks'] if x.get('task_id')==os.environ['CONTROL_TASK_ID']]
          if len(matches)!=1 or matches[0].get('candidate_sha')!=os.environ['CONTROL_CANDIDATE_SHA']:
              raise SystemExit('queue identity mismatch')
          task=matches[0]; attempt=task.get('attempt'); claim_count=task.get('claim_count')
          now=datetime.now(timezone.utc).replace(microsecond=0)
          lease_seconds=int(os.environ['CONTROL_DEEP_LEASE_SECONDS'])
          expires=(now+timedelta(seconds=lease_seconds)).isoformat().replace('+00:00','Z')
          queue=renew_claim(queue, task_id=os.environ['CONTROL_TASK_ID'], role=ROLE_B, worker_instance='B1', run_id=run_id, now=now, lease_seconds=lease_seconds)
          task=[x for x in queue['tasks'] if x.get('task_id')==os.environ['CONTROL_TASK_ID']][0]
          if task.get('attempt')!=attempt or task.get('claim_count')!=claim_count:
              raise SystemExit('renew altered attempt history')
          run_matches=[x for x in runs.get('runs',[]) if x.get('run_id')==run_id]
          if len(run_matches)!=1:
              raise SystemExit('run identity mismatch')
          run=run_matches[0]
          if run.get('task_id')!=os.environ['CONTROL_TASK_ID'] or run.get('role')!='governance_release_assurance' or run.get('outcome')!='EXECUTING':
              raise SystemExit('run is not current H12 B1 execution')
          run['heartbeat_at']=now.isoformat().replace('+00:00','Z')
          run['lease_expires_at']=expires
          validate_parallel_queue(queue)
          queue_path.write_text(json.dumps(queue,indent=2)+'\n')
          runs_path.write_text(json.dumps(runs,indent=2)+'\n')
          print(expires)
          PY
            expected_expiry="$(PYTHONPATH="$CONTROL_B_CODE_DIR" python - "$state/control/DISPATCH_QUEUE.json" "$state/control/DISPATCH_RUNS.json" "$run_id" <<'PY'
          import json, os, sys
          q=json.load(open(sys.argv[1])); r=json.load(open(sys.argv[2])); run=sys.argv[3]
          t=[x for x in q['tasks'] if x.get('task_id')==os.environ['CONTROL_TASK_ID']][0]
          rr=[x for x in r['runs'] if x.get('run_id')==run][0]
          if t.get('claim_expires_at') != rr.get('lease_expires_at'):
              raise SystemExit('renewal expiry mismatch before persist')
          print(t['claim_expires_at'])
          PY
          )"
            git -C "$state" fetch --quiet origin "refs/heads/$CONTROL_RUNTIME_REF"
            [ "$(git -C "$state" rev-parse FETCH_HEAD)" = "$ref" ] || continue
            [ "$(git -C "$state" rev-parse FETCH_HEAD:control/DISPATCH_QUEUE.json)" = "$queue_blob" ] || continue
            git -C "$state" add control/DISPATCH_QUEUE.json control/DISPATCH_RUNS.json
            git -C "$state" commit --quiet -m 'runtime: renew Gate-8 H12 B1 claim'
            git -C "$state" push --quiet origin "HEAD:refs/heads/$CONTROL_RUNTIME_REF" || continue
            verify="$RUNNER_TEMP/verify-$n"; rm -rf "$verify"
            git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$CONTROL_PRIVATE_URL" "$verify"
            PYTHONPATH="$CONTROL_B_CODE_DIR" python - "$verify/control/DISPATCH_QUEUE.json" "$verify/control/DISPATCH_RUNS.json" "$run_id" "$expected_expiry" <<'PY'
          import json, os, sys
          q=json.load(open(sys.argv[1])); r=json.load(open(sys.argv[2])); run=sys.argv[3]; expected=sys.argv[4]
          t=[x for x in q['tasks'] if x.get('task_id')==os.environ['CONTROL_TASK_ID']]
          rr=[x for x in r['runs'] if x.get('run_id')==run]
          if len(t)!=1 or len(rr)!=1: raise SystemExit('readback identity mismatch')
          if t[0].get('claim_expires_at')!=expected or rr[0].get('lease_expires_at')!=expected:
              raise SystemExit('renewal not authoritative in queue and runs')
          if rr[0].get('outcome')!='EXECUTING': raise SystemExit('run not executing after renewal')
          PY
            success=true; break
          done
          [ "$success" = true ]
          echo 'G8_H12_B1_COMPLETION=LEASE_RENEWED_QUEUE_AND_RUNS'

      - name: Validate reviewer result comment
        if: steps.command.outputs.action == 'complete'
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          f=.control/g8-h11-b1-completion-command.json
          cid="$(jq -r '.review_comment_id' "$f")"; run_id="$(jq -r '.active_run_id' "$f")"
          result="$RUNNER_TEMP/result.json"
          GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${CONTROL_PLANE_REPOSITORY}/issues/comments/${cid}" --jq '.body' > "$result"
          jq -e --arg task "$CONTROL_TASK_ID" --arg cand "$CONTROL_CANDIDATE_SHA" --arg run "$run_id" '.version=="1.0" and .task_id==$task and .run_id==$run and .role=="governance_release_assurance" and (.outcome=="PASS" or .outcome=="FAIL" or .outcome=="INDETERMINATE") and .candidate_sha==$cand and (.summary|type=="string") and (.findings|type=="array") and all(.findings[];type=="string") and (.evidence|type=="array") and all(.evidence[];type=="string") and (keys|sort)==(["candidate_sha","evidence","findings","outcome","role","run_id","summary","task_id","version"]|sort)' "$result" >/dev/null
          echo "ACTIVE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "REVIEWER_RESULT=$result" >> "$GITHUB_ENV"

      - name: Persist result first and complete exact H12 claim
        if: steps.command.outputs.action == 'complete'
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          success=false
          for n in 1 2 3; do
            state="$RUNNER_TEMP/complete-$n"; rm -rf "$state"
            git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$CONTROL_PRIVATE_URL" "$state"
            set +e
            GH_TOKEN="$CONTROL_TOKEN" PYTHONPATH="$CONTROL_B_CODE_DIR" python "$CONTROL_B_CODE_DIR/tools/control_connected_worker_runtime_v1.py" complete --runtime-root "$state" --runtime-ref "$CONTROL_RUNTIME_REF" --github-repository "$CONTROL_PLANE_REPOSITORY" --task-id "$CONTROL_TASK_ID" --worker-instance B1 --active-run-id "$ACTIVE_RUN_ID" --result "$REVIEWER_RESULT" > "$RUNNER_TEMP/complete-$n.log" 2>&1
            rc=$?; set -e
            if [ "$rc" = 0 ]; then success=true; break; fi
            if grep -q 'CONTROL_RUNTIME_CAS_CONFLICT' "$RUNNER_TEMP/complete-$n.log"; then continue; fi
            cat "$RUNNER_TEMP/complete-$n.log"; exit 2
          done
          [ "$success" = true ]
          final="$RUNNER_TEMP/final"; git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$CONTROL_PRIVATE_URL" "$final"
          jq -e --arg task "$CONTROL_TASK_ID" '[.tasks[]|select(.task_id==$task)]|length==1 and .[0].active_run_id==null and .[0].active_role==null and .[0].active_worker_instance==null' "$final/control/DISPATCH_QUEUE.json" >/dev/null
          echo 'G8_H12_B1_COMPLETION=TERMINAL_GHOST_FREE'
