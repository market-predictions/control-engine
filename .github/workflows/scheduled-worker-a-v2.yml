name: Scheduled Worker A V2 — Retired Semantic Executor

# CONTROL #200 / 2026-08-24
# Worker A implementation intelligence is native ChatGPT chat only.
# This historical GitHub/provider A executor is intentionally non-recurring and
# cannot claim or semantically execute implementation_operations work.
# Keep workflow_dispatch only as a harmless retirement/readback surface.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-scheduled-worker-a-v2-retired
  cancel-in-progress: false

jobs:
  retirement-proof:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove semantic A executor is retired
        shell: bash
        run: |
          set -euo pipefail
          echo 'CONTROL_SCHEDULED_WORKER_A_V2=RETIRED_SEMANTIC_EXECUTOR'
          echo 'WORKER_A_SEMANTIC_RUNTIME=CHATGPT_CHAT_ONLY'
          echo 'GITHUB_ACTIONS_A_IMPLEMENTATION_INFERENCE=false'
          echo 'PROVIDER_A_IMPLEMENTATION_INFERENCE=false'
