name: Control Minimal Core lifecycle actuator

# CONTROL #206 / #207
# Deterministic lifecycle plumbing only. This workflow never performs semantic
# implementation, assurance, repair, integration, merge or release work.
# The existing ChatGPT scheduled role workers are the worker wake surface;
# this GitHub workflow is intentionally not a scheduler. Claims prove start.

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write

concurrency:
  group: control-minimal-core-lifecycle-v1
  cancel-in-progress: false

jobs:
  lifecycle:
    if: >-
      github.repository == 'market-predictions/control-engine' &&
      (github.event_name != 'issue_comment' ||
       (github.event.comment.user.login == 'market-predictions' &&
        (github.event.comment.body == 'CONTROL_CORE_RECONCILE_V1' ||
         startsWith(github.event.comment.body, 'CONTROL_CORE_CLAIM_V1 ') ||
         startsWith(github.event.comment.body, 'CONTROL_CORE_RECORD_V1 '))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public deterministic actuator code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight GitHub App identity and installation
        id: app-preflight
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived private-state token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'write'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate Minimal Core syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            control_engine/minimal_core.py \
            scripts/private_minimal_core_apply.py \
            scripts/project_integration_executor.py

      - name: Apply exact Minimal Core lifecycle command
        id: lifecycle
        shell: bash
        env:
          CONTROL_GITHUB_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != issue_comment ]; then
            python scripts/private_minimal_core_apply.py reconcile
            exit 0
          fi

          case "$COMMENT_BODY" in
            CONTROL_CORE_RECONCILE_V1)
              python scripts/private_minimal_core_apply.py reconcile
              ;;
            "CONTROL_CORE_CLAIM_V1 A1"|"CONTROL_CORE_CLAIM_V1 A1 AUTO")
              python scripts/private_minimal_core_apply.py claim --worker-instance A1 --task-id AUTO
              ;;
            "CONTROL_CORE_CLAIM_V1 A2"|"CONTROL_CORE_CLAIM_V1 A2 AUTO")
              python scripts/private_minimal_core_apply.py claim --worker-instance A2 --task-id AUTO
              ;;
            "CONTROL_CORE_CLAIM_V1 B1"|"CONTROL_CORE_CLAIM_V1 B1 AUTO")
              python scripts/private_minimal_core_apply.py claim --worker-instance B1 --task-id AUTO
              ;;
            CONTROL_CORE_CLAIM_V1\ A1\ *)
              task_id="${COMMENT_BODY#CONTROL_CORE_CLAIM_V1 A1 }"
              [[ "$task_id" =~ ^[A-Za-z0-9_.-]+$ ]]
              python scripts/private_minimal_core_apply.py claim --worker-instance A1 --task-id "$task_id"
              ;;
            CONTROL_CORE_CLAIM_V1\ A2\ *)
              task_id="${COMMENT_BODY#CONTROL_CORE_CLAIM_V1 A2 }"
              [[ "$task_id" =~ ^[A-Za-z0-9_.-]+$ ]]
              python scripts/private_minimal_core_apply.py claim --worker-instance A2 --task-id "$task_id"
              ;;
            CONTROL_CORE_CLAIM_V1\ B1\ *)
              task_id="${COMMENT_BODY#CONTROL_CORE_CLAIM_V1 B1 }"
              [[ "$task_id" =~ ^[A-Za-z0-9_.-]+$ ]]
              python scripts/private_minimal_core_apply.py claim --worker-instance B1 --task-id "$task_id"
              ;;
            CONTROL_CORE_RECORD_V1\ *)
              task_id="${COMMENT_BODY#CONTROL_CORE_RECORD_V1 }"
              [[ "$task_id" =~ ^[A-Za-z0-9_.-]+$ ]]
              python scripts/private_minimal_core_apply.py record --task-id "$task_id"
              ;;
            *)
              echo 'unsupported Minimal Core command' >&2
              exit 2
              ;;
          esac

      - name: Publish non-semantic actuator liveness
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ '${{ steps.lifecycle.outcome }}' = 'success' ]; then
            state=success
            description=CONTROL_MINIMAL_CORE_OK
          else
            state=failure
            description=CONTROL_MINIMAL_CORE_FAILED
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="control/minimal-core" \
            -f description="$description" >/dev/null

      - name: Prove semantic authority remains outside GitHub lifecycle plumbing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'CONTROL_MINIMAL_CORE_V1=true'
          echo 'GITHUB_ACTIONS_SEMANTIC_IMPLEMENTATION=false'
          echo 'GITHUB_ACTIONS_SEMANTIC_ASSURANCE=false'
          echo 'CONTROL_GITHUB_ROLE=DETERMINISTIC_LIFECYCLE_ONLY'
          echo 'GITHUB_ACTIONS_WORKER_SCHEDULER=false'
          echo 'CHATGPT_ROLE_WORKERS_WAKE=true'
          echo 'SECOND_QUEUE=false'
          echo 'TASK_SPECIFIC_RECOVERY=false'
