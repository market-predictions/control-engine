name: Scheduled Worker A V2

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-scheduled-worker-a-v2
  cancel-in-progress: false

jobs:
  scheduled-a1:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact public actuator code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate actuator syntax before private access
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/scheduled_worker_a_v2.sh
          python -m py_compile control_engine/scheduled_worker_a.py

      - name: Reconcile, claim and execute one A1 task
        shell: bash
        env:
          CONTROL_GITHUB_WRITE_TOKEN: ${{ secrets.CONTROL_GITHUB_WRITE_TOKEN }}
          CONTROL_CLOUDFLARE_API_TOKEN: ${{ secrets.CONTROL_CLOUDFLARE_API_TOKEN }}
          CONTROL_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CONTROL_CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_CLOUDFLARE_FREE_FAIL_CLOSED_ATTESTED: ${{ vars.CONTROL_CLOUDFLARE_FREE_FAIL_CLOSED_ATTESTED }}
        run: bash scripts/scheduled_worker_a_v2.sh
