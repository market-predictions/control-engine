name: Control deterministic runtime reconciler

# CONTROL #200 / principal boundary 2026-08-24
# Worker A semantic intelligence is native ChatGPT chat only.
# This workflow is NOT Worker A. It performs deterministic canonical runtime
# lifecycle operations only: PROJECT_INTAKE -> one queue reconciliation and,
# on an exact trusted principal marker, the existing canonical A1 claim step.
# It may not invoke semantic inference, repair candidates, assure, integrate,
# merge, release, or create another queue/state plane.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scheduled-worker-a-v2.yml'
      - 'scripts/private_reconcile_apply.py'
      - 'scripts/private_a1_claim_apply.py'
      - 'tests/test_private_reconcile_apply.py'

permissions:
  contents: read
  statuses: write

concurrency:
  group: control-deterministic-runtime-reconciler-v1
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'market-predictions/control-engine' &&
      (github.event_name != 'issue_comment' ||
       (github.event.comment.user.login == 'market-predictions' &&
        (github.event.comment.body == 'CONTROL_RUNTIME_RECONCILE_V1' ||
         startsWith(github.event.comment.body, 'CONTROL_A1_CLAIM_V1 '))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public deterministic actuator code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight GitHub App identity and installation
        id: app-preflight
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived private-state token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'write'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate deterministic lifecycle actuator syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/github_app_preflight.sh
          python -m py_compile \
            scripts/private_reconcile_apply.py \
            scripts/private_a1_claim_apply.py \
            scripts/project_integration_executor.py

      - name: Reconcile canonical private runtime state
        id: reconcile
        shell: bash
        env:
          CONTROL_GITHUB_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/private_reconcile_apply.py

      - name: Persist exact preferred canonical A1 claim
        id: claim
        if: >-
          github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, 'CONTROL_A1_CLAIM_V1 ')
        shell: bash
        env:
          CONTROL_GITHUB_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          task_id="${COMMENT_BODY#CONTROL_A1_CLAIM_V1 }"
          if [[ ! "$task_id" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo 'invalid canonical task id' >&2
            exit 2
          fi
          CONTROL_TASK_ID="$task_id" python scripts/private_a1_claim_apply.py

      - name: Publish non-semantic liveness status
        if: always() && github.event_name != 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ '${{ steps.reconcile.outcome }}' = 'success' ]; then
            state=success
            description=DETERMINISTIC_RUNTIME_RECONCILE_OK
          else
            state=failure
            description=DETERMINISTIC_RUNTIME_RECONCILE_FAILED
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="control/runtime-reconciler" \
            -f description="$description" >/dev/null

      - name: Prove semantic Worker A remains native ChatGPT only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'CONTROL_SCHEDULED_WORKER_A_V2=RETIRED_SEMANTIC_EXECUTOR'
          echo 'WORKER_A_SEMANTIC_RUNTIME=CHATGPT_CHAT_ONLY'
          echo 'GITHUB_ACTIONS_A_IMPLEMENTATION_INFERENCE=false'
          echo 'PROVIDER_A_IMPLEMENTATION_INFERENCE=false'
          echo 'CONTROL_GITHUB_ROLE=DETERMINISTIC_LIFECYCLE_ONLY'
