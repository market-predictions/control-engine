name: Gate-8 R18 Repair Actuator V1

# Deterministic implementation actuator for the single H15 P1.
# The semantic repair is specified by this ChatGPT implementation instance.
# This workflow only applies exact text substitutions, runs focused tests, and pushes the candidate branch.

on:
  push:
    branches:
      - control/199-g8-h13-b1-lifecycle-actuator-v1
    paths:
      - .control/g8-r18-repair-command.json
      - .github/workflows/g8-r18-repair-actuator-v1.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: control-199-g8-r18-repair-v1
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: market-predictions/control-engine
  TARGET_BRANCH: control/199-g8-b1-profile-activation-v1
  EXPECTED_HEAD: 3c4c049140bc7763e11ac750103982cb1ddaae35

jobs:
  repair:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/control/199-g8-h13-b1-lifecycle-actuator-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated actuator branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact R18 envelope
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .version == "1.0" and .action == "repair_exact_head" and
            .task_id == "CONTROL-199-G8-PR70-REPOSITORY-CI-WORKFLOW-BINDING-REPAIR-R18" and
            .expected_head == env.EXPECTED_HEAD and .target_branch == env.TARGET_BRANCH and
            .finding_comment_id == 3857698973 and
            (.nonce | type == "string") and (.nonce | length > 0)
          ' .control/g8-r18-repair-command.json >/dev/null

      - name: Preflight GitHub App
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create short-lived implementation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'write'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Clone exact frozen candidate
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CONTROL_TOKEN"
          url="https://x-access-token:${CONTROL_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          repo="$RUNNER_TEMP/candidate"
          git clone --quiet --single-branch --branch "$TARGET_BRANCH" "$url" "$repo"
          [ "$(git -C "$repo" rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          echo "REPO=$repo" >> "$GITHUB_ENV"
          echo "REPO_URL=$url" >> "$GITHUB_ENV"

      - name: Apply only H15 repository-scoped CI identity repair
        shell: bash
        run: |
          set -euo pipefail
          python - "$REPO" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          wf = root / '.github/workflows/canonical-b1-dual-executor-v1.yml'
          tests = root / 'tests/test_canonical_b1_dual_executor_v1.py'

          text = wf.read_text(encoding='utf-8')
          old = '  CONTROL_CI_WORKFLOW_ID: 337765381\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one global Control Engine workflow id')
          text = text.replace(old, '')

          old = '''          GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${TARGET_REPOSITORY}/actions/runs/${ci_run_id}" > "$RUNNER_TEMP/required-ci.json"\n          jq -e --arg sha "$TARGET_CANDIDATE_SHA" --argjson workflow_id "$CONTROL_CI_WORKFLOW_ID" --argjson run_id "$ci_run_id" '\n'''
          new = '''          GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${TARGET_REPOSITORY}/actions/runs/${ci_run_id}" > "$RUNNER_TEMP/required-ci.json"\n          ci_workflow_id="$(jq -r '.workflow_id // empty' "$RUNNER_TEMP/required-ci.json")"\n          [[ "$ci_workflow_id" =~ ^[0-9]+$ ]]\n          jq -e --arg sha "$TARGET_CANDIDATE_SHA" --argjson workflow_id "$ci_workflow_id" --argjson run_id "$ci_run_id" '\n'''
          if text.count(old) != 1:
              raise SystemExit('pre-semantic CI binding block mismatch')
          text = text.replace(old, new)

          old = "          printf 'ci_run_id=%s\\n' \"$ci_run_id\" >> \"$GITHUB_OUTPUT\"\n"
          new = old + "          printf 'ci_workflow_id=%s\\n' \"$ci_workflow_id\" >> \"$GITHUB_OUTPUT\"\n"
          if text.count(old) != 1:
              raise SystemExit('CI output block mismatch')
          text = text.replace(old, new)

          old = '          REQUIRED_CI_RUN_ID: $' + '{{ steps.evidence.outputs.ci_run_id }}\n'
          new = old + '          REQUIRED_CI_WORKFLOW_ID: $' + '{{ steps.evidence.outputs.ci_workflow_id }}\n'
          if text.count(old) != 1:
              raise SystemExit('terminal CI env block mismatch')
          text = text.replace(old, new)

          old = '''            jq -e --arg sha "$TARGET_CANDIDATE_SHA" --argjson workflow_id "$CONTROL_CI_WORKFLOW_ID" --argjson run_id "$REQUIRED_CI_RUN_ID" '\n'''
          new = '''            jq -e --arg sha "$TARGET_CANDIDATE_SHA" --argjson workflow_id "$REQUIRED_CI_WORKFLOW_ID" --argjson run_id "$REQUIRED_CI_RUN_ID" '\n'''
          if text.count(old) != 1:
              raise SystemExit('terminal CI workflow binding mismatch')
          text = text.replace(old, new)
          wf.write_text(text, encoding='utf-8')

          text = tests.read_text(encoding='utf-8')
          old_token = "        '--argjson workflow_id \"$CONTROL_CI_WORKFLOW_ID\"',\n"
          if text.count(old_token) != 2:
              raise SystemExit('expected two old workflow-id test tokens')
          text = text.replace(old_token, "        '--argjson workflow_id \"$ci_workflow_id\"',\n", 1)
          text = text.replace(old_token, "        '--argjson workflow_id \"$REQUIRED_CI_WORKFLOW_ID\"',\n", 1)

          old = "        'printf \\'ci_run_id=%s\\\\n\\' \"$ci_run_id\" >> \"$GITHUB_OUTPUT\"',\n"
          new = old + "        'printf \\'ci_workflow_id=%s\\\\n\\' \"$ci_workflow_id\" >> \"$GITHUB_OUTPUT\"',\n"
          if text.count(old) != 1:
              raise SystemExit('CI output test token mismatch')
          text = text.replace(old, new)

          old = "        'REQUIRED_CI_RUN_ID: $" + "{{ steps.evidence.outputs.ci_run_id }}',\n"
          new = old + "        'REQUIRED_CI_WORKFLOW_ID: $" + "{{ steps.evidence.outputs.ci_workflow_id }}',\n"
          if text.count(old) != 1:
              raise SystemExit('terminal env test token mismatch')
          text = text.replace(old, new)

          old = '''def test_workflow_ci_binding_uses_immutable_workflow_id_not_display_name():\n    text = WORKFLOW.read_text(encoding="utf-8")\n    assert "CONTROL_CI_WORKFLOW_ID: 337765381" in text\n    assert text.count('.workflow_id == $workflow_id') >= 2\n    assert text.count('.id == $run_id') >= 2\n    assert '.name == "Control Engine CI"' not in text\n    assert 'REQUIRED_CI_RUN_ID: ${{ steps.evidence.outputs.ci_run_id }}' in text\n\n\n'''
          new = '''def test_workflow_ci_binding_is_repository_scoped_and_immutable_through_completion():\n    text = WORKFLOW.read_text(encoding="utf-8")\n    assert "CONTROL_CI_WORKFLOW_ID: 337765381" not in text\n    evidence = text.split("- name: Collect exact evidence and execute deterministic route", 1)[1]\n    evidence = evidence.split("- name: Revalidate exact claim and persist terminal result", 1)[0]\n    assert 'gh api "repos/${TARGET_REPOSITORY}/actions/runs/${ci_run_id}"' in evidence\n    assert 'ci_workflow_id="$(jq -r \\'.workflow_id // empty\\' "$RUNNER_TEMP/required-ci.json")"' in evidence\n    assert '[[ "$ci_workflow_id" =~ ^[0-9]+$ ]]' in evidence\n    assert '--argjson workflow_id "$ci_workflow_id"' in evidence\n    assert "printf 'ci_workflow_id=%s\\\\n' \"$ci_workflow_id\" >> \"$GITHUB_OUTPUT\"" in evidence\n    assert text.count('.workflow_id == $workflow_id') >= 2\n    assert text.count('.id == $run_id') >= 2\n    assert '.name == "Control Engine CI"' not in text\n    assert 'REQUIRED_CI_RUN_ID: ${{ steps.evidence.outputs.ci_run_id }}' in text\n    assert 'REQUIRED_CI_WORKFLOW_ID: ${{ steps.evidence.outputs.ci_workflow_id }}' in text\n    terminal = text.split("- name: Revalidate exact claim and persist terminal result", 1)[1]\n    assert '--argjson workflow_id "$REQUIRED_CI_WORKFLOW_ID"' in terminal\n\n\n'''
          if text.count(old) != 1:
              raise SystemExit('workflow-id regression function mismatch')
          text = text.replace(old, new)
          tests.write_text(text, encoding='utf-8')
          PY

          cd "$REPO"
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          [ "$changed" = $'.github/workflows/canonical-b1-dual-executor-v1.yml\ntests/test_canonical_b1_dual_executor_v1.py' ]
          git diff --check

      - name: Run focused R18 regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO"
          python -m pip install --disable-pip-version-check -q pytest
          python -m py_compile scripts/canonical_b1_dual_executor_v1.py tests/test_canonical_b1_dual_executor_v1.py
          python -m pytest -q tests/test_canonical_b1_dual_executor_v1.py

      - name: Commit and push exact repair
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO"
          git config user.name 'control-chatgpt-a1[bot]'
          git config user.email 'control-chatgpt-a1[bot]@users.noreply.github.com'
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          git add -- .github/workflows/canonical-b1-dual-executor-v1.yml tests/test_canonical_b1_dual_executor_v1.py
          git commit -m 'fix: scope B1 CI workflow identity to selected repo'
          before="$(git rev-parse HEAD^)"
          [ "$before" = "$EXPECTED_HEAD" ]
          git push "$REPO_URL" "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "R18_CANDIDATE_SHA=$(git rev-parse HEAD)"
