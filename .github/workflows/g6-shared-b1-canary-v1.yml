name: Gate 6 Shared B1 Canary V1

on:
  push:
    branches:
      - control/g6-shared-b1-actuator-v1
    paths:
      - .control/g6-shared-b1-command.json
      - .github/workflows/g6-shared-b1-canary-v1.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: control-g6-shared-b1-canary-v1
  cancel-in-progress: false

env:
  CONTROL_PLANE_REPOSITORY: market-predictions/control-plane
  CONTROL_RUNTIME_REF: control-runtime-state
  CONTROL_PRIVATE_B_CODE_REF: runtime/public-b-v2-code-r2
  CONTROL_PRIVATE_A_CODE_REF: recovery/187-policy-metadata-r1
  CONTROL_PRIVATE_A_CODE_SHA: 62cf2a88edd8700c073e51274d331210c7a36900
  CONTROL_TASK_ID: CONTROL-199-G6-SHARED-B1-CANARY
  CONTROL_HANDOVER_ID: CONTROL-199-G6-CANARY-H1
  CONTROL_BASE_SHA: 07ca785b21da1f1af2b2db1a620c15de5a1ae2b9
  CONTROL_CANDIDATE_SHA: 288e2313413d7991608cfd886fa0a50ef1d8aca9
  CONTROL_CANDIDATE_BRANCH: control/g6-shared-b1-canary-v1

jobs:
  canary:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/control/g6-shared-b1-actuator-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout integrated executor plus isolated actuator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact one-shot command
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.version == "1.0" and .action == "run" and .task_id == env.CONTROL_TASK_ID and .candidate_sha == env.CONTROL_CANDIDATE_SHA and .base_sha == env.CONTROL_BASE_SHA' .control/g6-shared-b1-command.json >/dev/null

      - name: Preflight GitHub App
        id: app-preflight
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create minimal canonical-state token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'write'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconcile Gate-6 intake and claim preferred B1
        id: claim
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CONTROL_TOKEN"
          url="https://x-access-token:${CONTROL_TOKEN}@github.com/${CONTROL_PLANE_REPOSITORY}.git"
          b_code="$RUNNER_TEMP/control-b-code"
          a_code="$RUNNER_TEMP/control-a-code"
          git clone --quiet --single-branch --branch "$CONTROL_PRIVATE_B_CODE_REF" "$url" "$b_code"
          git clone --quiet --single-branch --branch "$CONTROL_PRIVATE_A_CODE_REF" "$url" "$a_code"
          [ "$(git -C "$a_code" rev-parse HEAD)" = "$CONTROL_PRIVATE_A_CODE_SHA" ]
          printf 'CONTROL_B_CODE_DIR=%s\n' "$b_code" >> "$GITHUB_ENV"

          reconciled=false
          for cas_attempt in 1 2 3; do
            state="$RUNNER_TEMP/state-reconcile-${cas_attempt}"
            rm -rf "$state"
            git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$url" "$state"
            git -C "$state" config user.name 'control-g6-actuator[bot]'
            git -C "$state" config user.email 'control-g6-actuator[bot]@users.noreply.github.com'
            observed_ref="$(git -C "$state" rev-parse HEAD)"
            observed_blob="$(git -C "$state" rev-parse 'HEAD:control/DISPATCH_QUEUE.json')"

            python "$a_code/dispatcher/cli.py" reconcile --queue "$state/control/DISPATCH_QUEUE.json" --runs "$state/control/DISPATCH_RUNS.json" >/dev/null
            python control_engine/scheduled_worker_a.py resume-a-unavailable --code-dir "$a_code" --queue "$state/control/DISPATCH_QUEUE.json" --output "$RUNNER_TEMP/resume-a.json" >/dev/null
            python "$a_code/tools/control_project_intake_reconcile_v1.py" --queue "$state/control/DISPATCH_QUEUE.json" --intake-dir "$state/control/project-intake" --handover-dir "$state/control/handovers" --worker-result-dir "$state/control/worker-results" --write --report "$RUNNER_TEMP/intake-report.json" >/dev/null
            python "$a_code/dispatcher/cli.py" validate --queue "$state/control/DISPATCH_QUEUE.json" >/dev/null

            git -C "$state" fetch --quiet origin "refs/heads/${CONTROL_RUNTIME_REF}"
            current_ref="$(git -C "$state" rev-parse FETCH_HEAD)"
            current_blob="$(git -C "$state" rev-parse 'FETCH_HEAD:control/DISPATCH_QUEUE.json')"
            if [ "$current_ref" != "$observed_ref" ] || [ "$current_blob" != "$observed_blob" ]; then
              continue
            fi
            if [ -n "$(git -C "$state" status --porcelain -- control/DISPATCH_QUEUE.json control/DISPATCH_RUNS.json control/project-intake)" ]; then
              git -C "$state" add -- control/DISPATCH_QUEUE.json control/DISPATCH_RUNS.json control/project-intake
              git -C "$state" commit --quiet -m 'runtime: reconcile CONTROL #199 Gate-6 canary'
              if ! git -C "$state" push --quiet origin "HEAD:refs/heads/${CONTROL_RUNTIME_REF}"; then
                continue
              fi
            fi
            reconciled=true
            break
          done
          [ "$reconciled" = true ]

          state="$RUNNER_TEMP/state-claim"
          rm -rf "$state"
          git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$url" "$state"
          selection="$RUNNER_TEMP/selection.json"
          python control_engine/scheduled_worker_b.py select-b1 --code-dir "$b_code" --queue "$state/control/DISPATCH_QUEUE.json" --output "$selection" >/dev/null
          python - "$selection" "$state/control/DISPATCH_QUEUE.json" <<'PY'
          import json, os, sys
          selection=json.load(open(sys.argv[1], encoding='utf-8'))
          queue=json.load(open(sys.argv[2], encoding='utf-8'))
          task_id=os.environ['CONTROL_TASK_ID']
          if selection.get('selected') is not True or selection.get('task_id') != task_id:
              raise SystemExit('Gate-6 canary is not deterministic preferred B1 task')
          matches=[item for item in queue.get('tasks',[]) if item.get('task_id') == task_id]
          if len(matches) != 1: raise SystemExit('canonical task identity mismatch')
          task=matches[0]
          if task.get('candidate_sha') != os.environ['CONTROL_CANDIDATE_SHA']: raise SystemExit('candidate mismatch')
          if task.get('handover_id') != os.environ['CONTROL_HANDOVER_ID']: raise SystemExit('handover mismatch')
          if task.get('merge_policy') != 'NEVER': raise SystemExit('canary merge policy mismatch')
          PY

          GH_TOKEN="$CONTROL_TOKEN" PYTHONPATH="$b_code" python "$b_code/tools/control_connected_worker_runtime_v1.py" claim \
            --runtime-root "$state" \
            --runtime-ref "$CONTROL_RUNTIME_REF" \
            --task-id "$CONTROL_TASK_ID" \
            --worker-instance B1 \
            --backend github-actions/g6-shared-b1-standard-v1 \
            --lease-seconds 900 > "$RUNNER_TEMP/claim.json"
          run_id="$(jq -r '.run_id' "$RUNNER_TEMP/claim.json")"
          [ -n "$run_id" ] && [ "$run_id" != null ]
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Build B0 evidence and invoke exactly one STANDARD executor
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
          CONTROL_CLOUDFLARE_API_TOKEN: ${{ secrets.CONTROL_CLOUDFLARE_API_TOKEN }}
          CONTROL_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CONTROL_CLOUDFLARE_ACCOUNT_ID }}
          ACTIVE_RUN_ID: ${{ steps.claim.outputs.run_id }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          public_url="https://github.com/${GITHUB_REPOSITORY}.git"
          main_head="$(git ls-remote "$public_url" refs/heads/main | awk '{print $1}')"
          candidate_head="$(git ls-remote "$public_url" "refs/heads/${CONTROL_CANDIDATE_BRANCH}" | awk '{print $1}')"
          [ "$main_head" = "$CONTROL_BASE_SHA" ]
          [ "$candidate_head" = "$CONTROL_CANDIDATE_SHA" ]

          git fetch --quiet origin "$CONTROL_BASE_SHA" "$CONTROL_CANDIDATE_SHA"
          git diff --name-only "$CONTROL_BASE_SHA" "$CONTROL_CANDIDATE_SHA" > "$RUNNER_TEMP/changed-files.txt"
          printf 'fixtures/control_b1_gate6_canary.txt\n' > "$RUNNER_TEMP/expected-files.txt"
          cmp "$RUNNER_TEMP/changed-files.txt" "$RUNNER_TEMP/expected-files.txt"
          git diff --no-ext-diff --unified=3 "$CONTROL_BASE_SHA" "$CONTROL_CANDIDATE_SHA" > "$RUNNER_TEMP/candidate.diff"
          git show "$CONTROL_CANDIDATE_SHA:fixtures/control_b1_gate6_canary.txt" > "$RUNNER_TEMP/actual-file.txt"
          printf 'CONTROL_B1_GATE6_CANARY=PASS\n' > "$RUNNER_TEMP/expected-file.txt"
          cmp "$RUNNER_TEMP/actual-file.txt" "$RUNNER_TEMP/expected-file.txt"

          state="$RUNNER_TEMP/state-review"
          url="https://x-access-token:${CONTROL_TOKEN}@github.com/${CONTROL_PLANE_REPOSITORY}.git"
          git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$url" "$state"
          observed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/g6_shared_b1_canary.py \
            --queue "$state/control/DISPATCH_QUEUE.json" \
            --diff "$RUNNER_TEMP/candidate.diff" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --task-id "$CONTROL_TASK_ID" \
            --candidate-sha "$CONTROL_CANDIDATE_SHA" \
            --base-sha "$CONTROL_BASE_SHA" \
            --candidate-branch "$CONTROL_CANDIDATE_BRANCH" \
            --active-run-id "$ACTIVE_RUN_ID" \
            --observed-at "$observed_at" \
            --actual-file "$RUNNER_TEMP/actual-file.txt" \
            --output "$RUNNER_TEMP/result.json"

      - name: Revalidate candidate and canonical claim, then persist result and terminal completion
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTIVE_RUN_ID: ${{ steps.claim.outputs.run_id }}
        run: |
          set -euo pipefail
          public_url="https://github.com/${GITHUB_REPOSITORY}.git"
          [ "$(git ls-remote "$public_url" refs/heads/main | awk '{print $1}')" = "$CONTROL_BASE_SHA" ]
          [ "$(git ls-remote "$public_url" "refs/heads/${CONTROL_CANDIDATE_BRANCH}" | awk '{print $1}')" = "$CONTROL_CANDIDATE_SHA" ]

          url="https://x-access-token:${CONTROL_TOKEN}@github.com/${CONTROL_PLANE_REPOSITORY}.git"
          success=false
          for cas_attempt in 1 2 3; do
            state="$RUNNER_TEMP/state-complete-${cas_attempt}"
            rm -rf "$state"
            git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$url" "$state"
            set +e
            GH_TOKEN="$CONTROL_TOKEN" PYTHONPATH="$CONTROL_B_CODE_DIR" python "$CONTROL_B_CODE_DIR/tools/control_connected_worker_runtime_v1.py" complete \
              --runtime-root "$state" \
              --runtime-ref "$CONTROL_RUNTIME_REF" \
              --github-repository "$CONTROL_PLANE_REPOSITORY" \
              --task-id "$CONTROL_TASK_ID" \
              --worker-instance B1 \
              --active-run-id "$ACTIVE_RUN_ID" \
              --result "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/complete-${cas_attempt}.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" = 0 ]; then success=true; break; fi
            if grep -q 'CONTROL_RUNTIME_CAS_CONFLICT' "$RUNNER_TEMP/complete-${cas_attempt}.log"; then continue; fi
            cat "$RUNNER_TEMP/complete-${cas_attempt}.log"
            exit 2
          done
          [ "$success" = true ]

      - name: Publish bounded Gate-6 liveness
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          [ "$JOB_STATUS" = success ] && state=success
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='control/g6-shared-b1-canary' -f description="G6_shared_B1_${JOB_STATUS}" >/dev/null
