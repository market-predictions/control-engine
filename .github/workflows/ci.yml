name: Control Engine CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate JSON contracts and fixtures
        run: |
          python -m json.tool ENGINE_MANIFEST.json >/dev/null
          python -m json.tool ENGINE_BUNDLE_V1.json >/dev/null
          python -m json.tool schemas/control_project_progress_event_v1.schema.json >/dev/null
          python -m json.tool fixtures/dashboard_registry.json >/dev/null
          python -m json.tool fixtures/dashboard_events.json >/dev/null
      - name: Validate manifest paths and bundle coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('ENGINE_MANIFEST.json').read_text())
          bundle = json.loads(Path(manifest['consumer_bundle']).read_text())
          assert manifest['repository'] == 'market-predictions/control-engine'
          assert manifest['consumer_binding'] == 'EXACT_40_CHAR_COMMIT_SHA_ONLY'
          assert manifest['private_data_policy'] == 'NO_PRIVATE_RUNTIME_STATE'
          assert manifest['control_runtime'] == 'CONTROL_AUTONOMY_V3_1'
          bundled = {entry['path'] for entry in bundle['files']}
          for module in manifest['modules']:
              for key in ('implementation', 'schema'):
                  path = module[key]
                  assert Path(path).is_file(), path
                  assert path in bundled, path
          print('CONTROL_ENGINE_MANIFEST_BINDING=PASS')
          PY
      - name: Compile active engine
        run: |
          python -m py_compile control_engine/__init__.py control_engine/timeline.py control_engine/bundle.py control_engine/assurance_capsule.py control_engine/kernel_v31.py control_engine/migration_v31.py scripts/control_kernel_v31.py
          bash -n scripts/github_app_preflight.sh
      - name: Verify immutable consumer bundle
        run: python -m control_engine.bundle ENGINE_BUNDLE_V1.json
      - name: Run regressions
        run: python -m pytest -q
      - name: Prove active V3.1 surface
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)" = $'ci.yml\ncontrol-kernel-v3-1.yml'
          test "$(find control_engine -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)" = $'__init__.py\nassurance_capsule.py\nbundle.py\nkernel_v31.py\nmigration_v31.py\ntimeline.py'
          test "$(find scripts -maxdepth 1 -type f -printf '%f\n' | sort)" = $'control_kernel_v31.py\ngithub_app_preflight.sh'
          forbidden="$(find control_engine scripts .github/workflows -type f \( -iname '*cloudflare*' -o -iname '*groq*' -o -iname '*scheduled_worker*' -o -iname '*minimal_core*' -o -iname '*project_integration*' \) -print)"
          test -z "$forbidden"
          echo 'CONTROL_V3_1_ACTIVE_SURFACE=PASS'
      - name: Synthetic engine smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from control_engine.timeline import build_render_model
          registry = json.loads(Path('fixtures/dashboard_registry.json').read_text())
          events = json.loads(Path('fixtures/dashboard_events.json').read_text())
          model = build_render_model(registry, events)
          assert model['normalization'] == 'none'
          assert model['series'][0]['points'][-1]['cumulative_retained_progress'] == 2
          assert model['series'][1]['points'][-1]['cumulative_retained_progress'] == 3
          print('CONTROL_ENGINE_PUBLIC_SMOKE=PASS')
          PY
