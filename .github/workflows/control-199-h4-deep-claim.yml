name: CONTROL 199 H4 DEEP B1 Completion

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/control-199-h4-deep-claim.yml'

permissions:
  contents: read

concurrency:
  group: control-199-g8-h4-deep-completion-v1
  cancel-in-progress: false

jobs:
  complete:
    if: >-
      github.repository == 'market-predictions/control-engine' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'control/199-g8-h4-deep-assurance-v1' &&
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pre-activation actuator branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: control/199-g8-h4-deep-assurance-v1
          persist-credentials: false
          fetch-depth: 1

      - name: Create short-lived private Control token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'write'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prove exact public candidate and CI still current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh api repos/market-predictions/control-engine/pulls/70)"
          test "$(jq -r '.state' <<<"$pr")" = open
          test "$(jq -r '.draft' <<<"$pr")" = true
          test "$(jq -r '.merged' <<<"$pr")" = false
          test "$(jq -r '.head.sha' <<<"$pr")" = 9095d820bea744e93603654bbc548f63a4ffa61f
          test "$(jq -r '.base.sha' <<<"$pr")" = 0e0594b822cc15098fa8612a8c675e984f08d87d
          ci="$(gh api repos/market-predictions/control-engine/actions/runs/32781840040)"
          test "$(jq -r '.status' <<<"$ci")" = completed
          test "$(jq -r '.conclusion' <<<"$ci")" = success
          test "$(jq -r '.head_sha' <<<"$ci")" = 9095d820bea744e93603654bbc548f63a4ffa61f

      - name: Clone exact private lifecycle authority and prove current H4 claim
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          git clone --quiet --branch runtime/public-b-v2-code-r2 --single-branch "https://x-access-token:${APP_TOKEN}@github.com/market-predictions/control-plane.git" private-code
          test "$(git -C private-code rev-parse HEAD)" = 97ef7de0007b4886e336182c7a9a0ee20ae77455
          git clone --quiet --branch control-runtime-state --single-branch "https://x-access-token:${APP_TOKEN}@github.com/market-predictions/control-plane.git" runtime-state
          test "$(jq -r '.status' runtime-state/control/CONTROL_ASSURANCE_EXECUTION_PROFILE_V1.json)" = CANDIDATE_GATE8
          python control_engine/scheduled_worker_b.py assert-claim \
            --code-dir private-code \
            --queue runtime-state/control/DISPATCH_QUEUE.json \
            --task-id CONTROL-199-G8-B1-PROFILE-ACTIVATION-ASSURE-H4 \
            --output claim-readback.json
          test "$(jq -r '.candidate_sha' claim-readback.json)" = 9095d820bea744e93603654bbc548f63a4ffa61f

      - name: Collect complete raw DEEP evidence and classify deterministically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate repos/market-predictions/control-engine/pulls/70/reviews --jq '.[]' | jq -s '.' > reviews.json
          gh api --paginate repos/market-predictions/control-engine/pulls/70/comments --jq '.[]' | jq -s '.' > review-comments.json
          gh api --paginate repos/market-predictions/control-engine/issues/70/comments --jq '.[]' | jq -s '.' > issue-comments.json
          gh api --paginate -H 'Accept: application/vnd.github+json' repos/market-predictions/control-engine/issues/comments/5402142248/reactions --jq '.[]' | jq -s '.' > reactions.json
          python - <<'PY'
          import dataclasses
          import json
          from pathlib import Path
          from control_engine.codex_b1_strict import classify_trusted_review_snapshot

          intake = json.loads(Path('runtime-state/control/project-intake/CONTROL_199_G8_B1_PROFILE_ACTIVATION_ASSURE_H4.json').read_text())
          criteria = intake['queue_intent']['acceptance_criteria']
          decision = classify_trusted_review_snapshot(
              task_id='CONTROL-199-G8-B1-PROFILE-ACTIVATION-ASSURE-H4',
              handover_id='CONTROL-199-G8-ACTIVATION-H4',
              candidate_sha='9095d820bea744e93603654bbc548f63a4ffa61f',
              request_comment_id=5402142248,
              acceptance_criteria=criteria,
              trusted_actuator_login='market-predictions',
              reviews=json.loads(Path('reviews.json').read_text()),
              review_comments=json.loads(Path('review-comments.json').read_text()),
              trigger_reactions=json.loads(Path('reactions.json').read_text()),
              issue_comments=json.loads(Path('issue-comments.json').read_text()),
          )
          payload = dataclasses.asdict(decision)
          Path('decision.json').write_text(json.dumps(payload, indent=2) + '\n')
          if decision.status != 'COMPLETE' or decision.verdict not in {'PASS','FAIL','INDETERMINATE'}:
              raise SystemExit('terminal trusted Codex decision absent')
          result = {
              'version': '1.0',
              'task_id': 'CONTROL-199-G8-B1-PROFILE-ACTIVATION-ASSURE-H4',
              'run_id': json.loads(Path('claim-readback.json').read_text())['run_id'],
              'role': 'governance_release_assurance',
              'outcome': decision.verdict,
              'summary': decision.summary,
              'candidate_sha': '9095d820bea744e93603654bbc548f63a4ffa61f',
              'findings': list(decision.findings),
              'evidence': [
                  'CONTROL_ASSURANCE_EVIDENCE_CAPSULE_V1: START_PROVEN=true; deterministic_contradictions=[]',
                  'route=DEEP; request_comment_id=5402142248; trusted_actuator_login=market-predictions',
                  f'reviewed_commit={decision.reviewed_commit or ""}',
                  'exact_head_ci_run=32781840040:SUCCESS',
              ],
          }
          Path('h4-result.json').write_text(json.dumps(result, indent=2) + '\n')
          print(f"H4_CLASSIFIED_VERDICT={decision.verdict}")
          PY
          test "$(jq -r '.verdict' decision.json)" = FAIL

      - name: Persist immutable H4 FAIL and canonical terminal completion
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          active_run_id="$(jq -r '.run_id' claim-readback.json)"
          PYTHONPATH="$PWD/private-code" python private-code/tools/control_connected_worker_runtime_v1.py complete \
            --runtime-root runtime-state \
            --runtime-ref control-runtime-state \
            --github-repository market-predictions/control-plane \
            --task-id CONTROL-199-G8-B1-PROFILE-ACTIVATION-ASSURE-H4 \
            --worker-instance B1 \
            --active-run-id "$active_run_id" \
            --result h4-result.json
          git -C runtime-state fetch --quiet origin control-runtime-state
          git -C runtime-state reset --quiet --hard FETCH_HEAD
          python control_engine/scheduled_worker_b.py assert-finalized \
            --code-dir private-code \
            --queue runtime-state/control/DISPATCH_QUEUE.json \
            --task-id CONTROL-199-G8-B1-PROFILE-ACTIVATION-ASSURE-H4 \
            --run-id "$active_run_id"
          test "$(jq -r '.tasks[] | select(.task_id=="CONTROL-199-G8-B1-PROFILE-ACTIVATION-ASSURE-H4") | .last_verdict' runtime-state/control/DISPATCH_QUEUE.json)" = FAIL
          echo 'H4_TERMINAL_COMPLETION=PASS'
          echo 'H4_VERDICT=FAIL'
