name: Gate 8 External DEEP Assurance H3 V1

on:
  push:
    branches:
      - control/g8-deep-assurance-actuator-v1
    paths:
      - .control/g8-deep-assurance-h3-command.json
      - .github/workflows/g8-deep-assurance-h2-v1.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: control-g8-deep-assurance-h3-v1
  cancel-in-progress: false

env:
  CONTROL_PLANE_REPOSITORY: market-predictions/control-plane
  CONTROL_RUNTIME_REF: control-runtime-state
  CONTROL_PRIVATE_B_CODE_REF: runtime/public-b-v2-code-r2
  CONTROL_PRIVATE_B_CODE_SHA: 97ef7de0007b4886e336182c7a9a0ee20ae77455
  CONTROL_PRIVATE_A_CODE_REF: recovery/187-policy-metadata-r1
  CONTROL_PRIVATE_A_CODE_SHA: 62cf2a88edd8700c073e51274d331210c7a36900
  CONTROL_TASK_ID: CONTROL-199-G8-B1-PROFILE-ACTIVATION-ASSURE-H3
  CONTROL_HANDOVER_ID: CONTROL-199-G8-ACTIVATION-H3
  PREDECESSOR_TASK_ID: CONTROL-199-G8-B1-PROFILE-ACTIVATION-ASSURE-H2
  TARGET_REPOSITORY: market-predictions/control-engine
  TARGET_PR: '70'
  TARGET_CANDIDATE_SHA: 457b74abcfd3cdd6c2f4e6e6fbe52fe444ad5d82
  EXPECTED_BASE_SHA: 07ca785b21da1f1af2b2db1a620c15de5a1ae2b9
  EXPECTED_CI_RUN: '32698119377'
  INTEGRATED_FOUNDATION_SHA: 07ca785b21da1f1af2b2db1a620c15de5a1ae2b9

jobs:
  deep-assurance-h3:
    if: github.repository == 'market-predictions/control-engine' && github.ref == 'refs/heads/control/g8-deep-assurance-actuator-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout trusted external actuator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate command and trusted integrated adapter boundary
        id: command
        shell: bash
        run: |
          set -euo pipefail
          file=.control/g8-deep-assurance-h3-command.json
          jq -e '
            .version == "1.0" and
            (.action == "hold" or .action == "run") and
            .task_id == env.CONTROL_TASK_ID and
            .handover_id == env.CONTROL_HANDOVER_ID and
            .candidate_sha == env.TARGET_CANDIDATE_SHA and
            (.candidate_pr|tostring) == env.TARGET_PR and
            (.nonce | type == "string") and (.nonce | length > 0)
          ' "$file" >/dev/null
          action="$(jq -r '.action' "$file")"
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"
          git diff --quiet "$INTEGRATED_FOUNDATION_SHA" -- \
            control_engine/codex_b1.py \
            control_engine/codex_b1_strict.py \
            scripts/codex_b1_canary.py \
            control_engine/scheduled_worker_b.py
          python -m py_compile \
            control_engine/codex_b1.py \
            control_engine/codex_b1_strict.py \
            scripts/codex_b1_canary.py \
            control_engine/scheduled_worker_b.py

      - name: Hold without lifecycle mutation
        if: steps.command.outputs.action == 'hold'
        run: echo 'G8_H3_DEEP_ACTUATOR=HOLD'

      - name: Preflight Control GitHub App
        if: steps.command.outputs.action == 'run'
        shell: bash
        env:
          CONTROL_GITHUB_APP_ID: ${{ vars.CONTROL_GITHUB_APP_ID }}
          CONTROL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
        run: bash scripts/github_app_preflight.sh

      - name: Create bounded Control token
        if: steps.command.outputs.action == 'run'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CONTROL_GITHUB_APP_ID }}
          private-key: ${{ secrets.CONTROL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: 'write'
          permission-actions: 'read'
          permission-pull-requests: 'read'
          permission-issues: 'write'

      - name: Setup Python
        if: steps.command.outputs.action == 'run'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Claim, invoke one native Codex review, renew, classify and complete H3
        if: steps.command.outputs.action == 'run'
        shell: bash
        env:
          CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CONTROL_TOKEN"
          private_url="https://x-access-token:${CONTROL_TOKEN}@github.com/${CONTROL_PLANE_REPOSITORY}.git"
          b_code="$RUNNER_TEMP/control-b-code"
          a_code="$RUNNER_TEMP/control-a-code"
          git clone --quiet --single-branch --branch "$CONTROL_PRIVATE_B_CODE_REF" "$private_url" "$b_code"
          git clone --quiet --single-branch --branch "$CONTROL_PRIVATE_A_CODE_REF" "$private_url" "$a_code"
          [ "$(git -C "$b_code" rev-parse HEAD)" = "$CONTROL_PRIVATE_B_CODE_SHA" ]
          [ "$(git -C "$a_code" rev-parse HEAD)" = "$CONTROL_PRIVATE_A_CODE_SHA" ]

          reconciled=false
          for cas_attempt in 1 2 3; do
            state="$RUNNER_TEMP/reconcile-${cas_attempt}"
            rm -rf "$state"
            git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$private_url" "$state"
            git -C "$state" config user.name 'control-g8-deep-actuator[bot]'
            git -C "$state" config user.email 'control-g8-deep-actuator[bot]@users.noreply.github.com'
            observed_ref="$(git -C "$state" rev-parse HEAD)"
            observed_blob="$(git -C "$state" rev-parse 'HEAD:control/DISPATCH_QUEUE.json')"
            python "$a_code/dispatcher/cli.py" reconcile \
              --queue "$state/control/DISPATCH_QUEUE.json" \
              --runs "$state/control/DISPATCH_RUNS.json" >/dev/null
            python "$a_code/tools/control_project_intake_reconcile_v1.py" \
              --queue "$state/control/DISPATCH_QUEUE.json" \
              --intake-dir "$state/control/project-intake" \
              --handover-dir "$state/control/handovers" \
              --worker-result-dir "$state/control/worker-results" \
              --write --report "$RUNNER_TEMP/intake-report.json" >/dev/null

            if jq -e --arg task "$PREDECESSOR_TASK_ID" '
              [.tasks[] | select(.task_id == $task)][0] as $t |
              $t != null and
              $t.state == "ASSURANCE_QUEUED" and
              $t.active_run_id == null and
              ($t.attempt >= $t.max_attempts)
            ' "$state/control/DISPATCH_QUEUE.json" >/dev/null; then
              python "$a_code/dispatcher/cli.py" block \
                --queue "$state/control/DISPATCH_QUEUE.json" \
                --task-id "$PREDECESSOR_TASK_ID" \
                --reason 'Attempt budget exhausted after expired Gate-8 H2 claim; no canonical semantic verdict.' >/dev/null
            fi

            python "$a_code/dispatcher/cli.py" validate \
              --queue "$state/control/DISPATCH_QUEUE.json" >/dev/null
            bad="$( { git -C "$state" diff --name-only; git -C "$state" ls-files --others --exclude-standard; } | sort -u | grep -Ev '^(control/DISPATCH_QUEUE\.json|control/DISPATCH_RUNS\.json|control/project-intake/[^/]+\.json)$' || true )"
            [ -z "$bad" ]
            git -C "$state" fetch --quiet origin "refs/heads/${CONTROL_RUNTIME_REF}"
            [ "$(git -C "$state" rev-parse FETCH_HEAD)" = "$observed_ref" ] || continue
            [ "$(git -C "$state" rev-parse 'FETCH_HEAD:control/DISPATCH_QUEUE.json')" = "$observed_blob" ] || continue
            if [ -n "$(git -C "$state" status --porcelain -- control/DISPATCH_QUEUE.json control/DISPATCH_RUNS.json control/project-intake)" ]; then
              git -C "$state" add -- control/DISPATCH_QUEUE.json control/DISPATCH_RUNS.json control/project-intake
              git -C "$state" commit --quiet -m 'runtime: reconcile Gate-8 H3 DEEP assurance intake'
              git -C "$state" push --quiet origin "HEAD:refs/heads/${CONTROL_RUNTIME_REF}" || continue
            fi
            reconciled=true
            break
          done
          [ "$reconciled" = true ]

          state="$RUNNER_TEMP/claim-state"
          rm -rf "$state"
          git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$private_url" "$state"
          selection="$RUNNER_TEMP/selection.json"
          python control_engine/scheduled_worker_b.py select-b1 \
            --code-dir "$b_code" \
            --queue "$state/control/DISPATCH_QUEUE.json" \
            --output "$selection" >/dev/null
          jq -e '
            .selected == true and
            .task_id == env.CONTROL_TASK_ID and
            .candidate_sha == env.TARGET_CANDIDATE_SHA and
            (.candidate_pr|tostring) == env.TARGET_PR
          ' "$selection" >/dev/null

          GH_TOKEN="$CONTROL_TOKEN" PYTHONPATH="$b_code" \
            python "$b_code/tools/control_connected_worker_runtime_v1.py" claim \
              --runtime-root "$state" \
              --runtime-ref "$CONTROL_RUNTIME_REF" \
              --task-id "$CONTROL_TASK_ID" \
              --worker-instance B1 \
              --backend github-actions/g8-deep-assurance-h3-v1 \
              --lease-seconds 900 > "$RUNNER_TEMP/claim.json"
          run_id="$(jq -r '.run_id' "$RUNNER_TEMP/claim.json")"
          [[ "$run_id" =~ ^run-[0-9a-f-]+$ ]]

          rm -rf "$state"
          git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$private_url" "$state"
          python control_engine/scheduled_worker_b.py assert-claim \
            --code-dir "$b_code" \
            --queue "$state/control/DISPATCH_QUEUE.json" \
            --task-id "$CONTROL_TASK_ID" \
            --output "$RUNNER_TEMP/claim-readback.json" >/dev/null
          [ "$(jq -r '.run_id' "$RUNNER_TEMP/claim-readback.json")" = "$run_id" ]
          [ "$(jq -r '.candidate_sha' "$RUNNER_TEMP/claim-readback.json")" = "$TARGET_CANDIDATE_SHA" ]

          jq -e '
            .protocol_id == "CONTROL_ASSURANCE_EXECUTION_PROFILE_V1" and
            .version == "1.0" and
            .status == "CANDIDATE_GATE8" and
            .lifecycle_authority.repository == env.CONTROL_PLANE_REPOSITORY and
            .lifecycle_authority.runtime_ref == env.CONTROL_RUNTIME_REF and
            .lifecycle_authority.worker_instance == "B1" and
            .lifecycle_authority.capacity == 1 and
            .standard.max_tokens == 1024 and
            .promotion_evidence.foundation_merge_sha == env.EXPECTED_BASE_SHA and
            .promotion_evidence.gate7_result_ref == "control/worker-results/CONTROL-199-G7-ETF-EU-PR103-H5.json" and
            .activation.candidate_sha == null and
            .activation.activation_pr == null and
            .activation.independent_assurance_result_ref == null and
            .principal_manual_relay_count == 0
          ' "$state/control/CONTROL_ASSURANCE_EXECUTION_PROFILE_V1.json" >/dev/null

          GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${TARGET_REPOSITORY}/pulls/${TARGET_PR}" > "$RUNNER_TEMP/pr.json"
          jq -e '
            .state == "open" and .merged == false and .draft == true and
            .head.sha == env.TARGET_CANDIDATE_SHA and
            .base.ref == "main" and .base.sha == env.EXPECTED_BASE_SHA
          ' "$RUNNER_TEMP/pr.json" >/dev/null

          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          .github/workflows/canonical-b1-dual-executor-v1.yml
          .github/workflows/ci.yml
          .github/workflows/scheduled-worker-b-v2.yml
          .github/workflows/worker-b-wake-bridge-v1.yml
          docs/B1_DUAL_EXECUTOR_V1.md
          scripts/canonical_b1_dual_executor_v1.py
          tests/test_canonical_b1_dual_executor_v1.py
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected-paths.txt"
          GH_TOKEN="$CONTROL_TOKEN" gh api --paginate "repos/${TARGET_REPOSITORY}/pulls/${TARGET_PR}/files?per_page=100" --jq '.[].filename' | sort > "$RUNNER_TEMP/actual-paths.txt"
          sort -o "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"

          GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${TARGET_REPOSITORY}/actions/runs/${EXPECTED_CI_RUN}" > "$RUNNER_TEMP/ci.json"
          jq -e '
            .head_sha == env.TARGET_CANDIDATE_SHA and
            .status == "completed" and
            .conclusion == "success"
          ' "$RUNNER_TEMP/ci.json" >/dev/null

          jq --arg task "$CONTROL_TASK_ID" '[.tasks[] | select(.task_id == $task)][0].acceptance_criteria' \
            "$state/control/DISPATCH_QUEUE.json" > "$RUNNER_TEMP/criteria.json"
          jq -e 'type == "array" and length > 0' "$RUNNER_TEMP/criteria.json" >/dev/null

          renew_same_claim() {
            local renewed=false
            local renew_attempt renew_state observed_ref observed_blob changed
            for renew_attempt in 1 2 3; do
              renew_state="$RUNNER_TEMP/renew-${renew_attempt}"
              rm -rf "$renew_state"
              git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$private_url" "$renew_state"
              git -C "$renew_state" config user.name 'control-g8-deep-actuator[bot]'
              git -C "$renew_state" config user.email 'control-g8-deep-actuator[bot]@users.noreply.github.com'
              observed_ref="$(git -C "$renew_state" rev-parse HEAD)"
              observed_blob="$(git -C "$renew_state" rev-parse 'HEAD:control/DISPATCH_QUEUE.json')"
              CONTROL_ACTIVE_RUN_ID="$run_id" PYTHONPATH="$b_code" python - "$renew_state/control/DISPATCH_QUEUE.json" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from tools.control_parallel_execution_v1 import renew_claim
          path = sys.argv[1]
          queue = json.load(open(path, encoding='utf-8'))
          queue = renew_claim(
              queue,
              task_id=os.environ['CONTROL_TASK_ID'],
              role='governance_release_assurance',
              worker_instance='B1',
              run_id=os.environ['CONTROL_ACTIVE_RUN_ID'],
              now=datetime.now(timezone.utc),
              lease_seconds=900,
          )
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(queue, handle, indent=2)
              handle.write('\n')
          PY
              changed="$(git -C "$renew_state" diff --name-only)"
              [ "$changed" = 'control/DISPATCH_QUEUE.json' ]
              git -C "$renew_state" fetch --quiet origin "refs/heads/${CONTROL_RUNTIME_REF}"
              [ "$(git -C "$renew_state" rev-parse FETCH_HEAD)" = "$observed_ref" ] || continue
              [ "$(git -C "$renew_state" rev-parse 'FETCH_HEAD:control/DISPATCH_QUEUE.json')" = "$observed_blob" ] || continue
              git -C "$renew_state" add -- control/DISPATCH_QUEUE.json
              git -C "$renew_state" commit --quiet -m 'runtime: renew Gate-8 H3 B1 claim'
              if git -C "$renew_state" push --quiet origin "HEAD:refs/heads/${CONTROL_RUNTIME_REF}"; then renewed=true; break; fi
            done
            [ "$renewed" = true ]
          }

          python scripts/codex_b1_canary.py request \
            --task-id "$CONTROL_TASK_ID" \
            --handover-id "$CONTROL_HANDOVER_ID" \
            --candidate-sha "$TARGET_CANDIDATE_SHA" \
            --criteria "$RUNNER_TEMP/criteria.json" \
            --output "$RUNNER_TEMP/request.txt"
          body="$(cat "$RUNNER_TEMP/request.txt")"
          GH_TOKEN="$CONTROL_TOKEN" gh api -X POST \
            "repos/${TARGET_REPOSITORY}/issues/${TARGET_PR}/comments" \
            -f body="$body" > "$RUNNER_TEMP/request-comment.json"
          comment_id="$(jq -r '.id' "$RUNNER_TEMP/request-comment.json")"
          actuator_login="$(jq -r '.user.login' "$RUNNER_TEMP/request-comment.json")"
          [[ "$comment_id" =~ ^[0-9]+$ ]]
          [ -n "$actuator_login" ] && [ "$actuator_login" != null ]

          terminal=false
          decision_status=PENDING
          for poll in $(seq 1 32); do
            if [ "$poll" = 12 ] || [ "$poll" = 24 ]; then
              renew_same_claim
            fi
            GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${TARGET_REPOSITORY}/pulls/${TARGET_PR}" > "$RUNNER_TEMP/pr-current.json"
            jq -e '.state == "open" and .merged == false and .head.sha == env.TARGET_CANDIDATE_SHA and .base.sha == env.EXPECTED_BASE_SHA' "$RUNNER_TEMP/pr-current.json" >/dev/null
            GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${TARGET_REPOSITORY}/pulls/${TARGET_PR}/reviews?per_page=100" > "$RUNNER_TEMP/reviews.json"
            GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${TARGET_REPOSITORY}/pulls/${TARGET_PR}/comments?per_page=100" > "$RUNNER_TEMP/review-comments.json"
            GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${TARGET_REPOSITORY}/issues/comments/${comment_id}/reactions?per_page=100" > "$RUNNER_TEMP/reactions.json"
            GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${TARGET_REPOSITORY}/issues/${TARGET_PR}/comments?per_page=100" > "$RUNNER_TEMP/issue-comments.json"
            python scripts/codex_b1_canary.py classify \
              --task-id "$CONTROL_TASK_ID" \
              --handover-id "$CONTROL_HANDOVER_ID" \
              --candidate-sha "$TARGET_CANDIDATE_SHA" \
              --request-comment-id "$comment_id" \
              --criteria "$RUNNER_TEMP/criteria.json" \
              --trusted-actuator-login "$actuator_login" \
              --reviews "$RUNNER_TEMP/reviews.json" \
              --review-comments "$RUNNER_TEMP/review-comments.json" \
              --reactions "$RUNNER_TEMP/reactions.json" \
              --issue-comments "$RUNNER_TEMP/issue-comments.json" \
              --output "$RUNNER_TEMP/decision.json"
            decision_status="$(jq -r '.status' "$RUNNER_TEMP/decision.json")"
            if [ "$decision_status" = COMPLETE ]; then terminal=true; break; fi
            if [ "$decision_status" = EXECUTION_UNAVAILABLE ]; then break; fi
            sleep 15
          done

          if [ "$terminal" = true ]; then
            verdict="$(jq -r '.verdict' "$RUNNER_TEMP/decision.json")"
            [ "$verdict" = PASS ] || [ "$verdict" = FAIL ] || [ "$verdict" = INDETERMINATE ]
            jq -n \
              --arg task "$CONTROL_TASK_ID" \
              --arg run "$run_id" \
              --arg candidate "$TARGET_CANDIDATE_SHA" \
              --arg outcome "$verdict" \
              --arg summary "$(jq -r '.summary' "$RUNNER_TEMP/decision.json")" \
              --arg comment_id "$comment_id" \
              --arg reviewed_commit "$(jq -r '.reviewed_commit // ""' "$RUNNER_TEMP/decision.json")" \
              --arg ci_run "$EXPECTED_CI_RUN" \
              --slurpfile decision "$RUNNER_TEMP/decision.json" \
              '{version:"1.0",task_id:$task,run_id:$run,role:"governance_release_assurance",outcome:$outcome,summary:$summary,candidate_sha:$candidate,findings:$decision[0].findings,evidence:["route=DEEP; semantic_executor=native Codex review","trusted_request_comment_id="+$comment_id,"reviewed_commit="+$reviewed_commit,"exact_head_ci_run="+$ci_run+" SUCCESS","private_profile_status=CANDIDATE_GATE8 before invocation","START_PROVEN=true before semantic invocation"]}' \
              > "$RUNNER_TEMP/result.json"
          else
            summary="No terminal trusted Codex exact-head evidence before the bounded H3 deadline."
            if [ -s "$RUNNER_TEMP/decision.json" ]; then summary="$(jq -r '.summary // empty' "$RUNNER_TEMP/decision.json")"; fi
            [ -n "$summary" ] || summary="No terminal trusted Codex exact-head evidence before the bounded H3 deadline."
            jq -n \
              --arg task "$CONTROL_TASK_ID" \
              --arg run "$run_id" \
              --arg candidate "$TARGET_CANDIDATE_SHA" \
              --arg summary "$summary" \
              --arg comment_id "$comment_id" \
              '{version:"1.0",task_id:$task,run_id:$run,role:"governance_release_assurance",outcome:"EXECUTION_UNAVAILABLE",summary:$summary,candidate_sha:$candidate,findings:["EXECUTION_UNAVAILABLE_CODEX_DEEP_TERMINAL_EVIDENCE"],evidence:["trusted_request_comment_id="+$comment_id,"No semantic verdict was fabricated."]}' \
              > "$RUNNER_TEMP/result.json"
          fi

          GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${TARGET_REPOSITORY}/pulls/${TARGET_PR}" > "$RUNNER_TEMP/pr-final.json"
          jq -e '.state == "open" and .merged == false and .head.sha == env.TARGET_CANDIDATE_SHA and .base.sha == env.EXPECTED_BASE_SHA' "$RUNNER_TEMP/pr-final.json" >/dev/null
          rm -rf "$state"
          git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$private_url" "$state"
          python control_engine/scheduled_worker_b.py assert-claim \
            --code-dir "$b_code" \
            --queue "$state/control/DISPATCH_QUEUE.json" \
            --task-id "$CONTROL_TASK_ID" \
            --output "$RUNNER_TEMP/pre-complete-claim.json" >/dev/null
          [ "$(jq -r '.run_id' "$RUNNER_TEMP/pre-complete-claim.json")" = "$run_id" ]

          success=false
          for cas_attempt in 1 2 3; do
            complete_state="$RUNNER_TEMP/complete-${cas_attempt}"
            rm -rf "$complete_state"
            git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$private_url" "$complete_state"
            set +e
            GH_TOKEN="$CONTROL_TOKEN" PYTHONPATH="$b_code" \
              python "$b_code/tools/control_connected_worker_runtime_v1.py" complete \
                --runtime-root "$complete_state" \
                --runtime-ref "$CONTROL_RUNTIME_REF" \
                --github-repository "$CONTROL_PLANE_REPOSITORY" \
                --task-id "$CONTROL_TASK_ID" \
                --worker-instance B1 \
                --active-run-id "$run_id" \
                --result "$RUNNER_TEMP/result.json" \
                > "$RUNNER_TEMP/complete-${cas_attempt}.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" = 0 ]; then success=true; break; fi
            if grep -q 'CONTROL_RUNTIME_CAS_CONFLICT' "$RUNNER_TEMP/complete-${cas_attempt}.log"; then continue; fi
            cat "$RUNNER_TEMP/complete-${cas_attempt}.log"
            exit 2
          done
          [ "$success" = true ]
          final="$RUNNER_TEMP/final-state"
          git clone --quiet --single-branch --branch "$CONTROL_RUNTIME_REF" "$private_url" "$final"
          python control_engine/scheduled_worker_b.py assert-finalized \
            --code-dir "$b_code" \
            --queue "$final/control/DISPATCH_QUEUE.json" \
            --task-id "$CONTROL_TASK_ID" \
            --run-id "$run_id" >/dev/null

      - name: Publish bounded actuator liveness
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.command.outputs.action }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          action="${ACTION:-unknown}"
          job_status="${JOB_STATUS:-failure}"
          state=failure
          [ "$job_status" = success ] && state=success
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="control/g8-deep-assurance-h3" \
            -f description="G8_H3_${action}_${job_status}" >/dev/null
